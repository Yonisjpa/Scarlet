}
function confirmDialog(text, okLabel) {
  return new Promise(res => {
    openView({
      cls: "dialog", cols: 2, hints: [["B", "Cancelar"], ["A", "Aceptar"]],
      render(el) {
        el.innerHTML = `<div class="dbox"><p>${esc(text)}</p><div class="dbtns"><button class="fi" data-r="0">Cancelar</button><button class="fi" data-r="1">${esc(okLabel)}</button></div></div>`;
        fis(el).forEach(b => b.onclick = () => { closeView(); res(b.dataset.r === "1"); });
      },
      onBack() { res(false); },

    });
  });
}
function pickerView(title, icon, options, current, onPick) {
  return {
    i: Math.max(0, options.findIndex(o => o.value === current)), hints: [["B", "Atrás"], ["A", "Elegir"]],
    render(el) {
      el.innerHTML = head(icon, title) + `<div class="vbody">${options.map((o, i) => `<button class="lrow fi" data-i="${i}"><span class="meta"><b>${esc(o.label)}</b></span><span class="val">${o.value === current ? "✓" : esc(o.extra || "")}</span></button>`).join("")}</div>`;
      fis(el).forEach(b => b.onclick = () => { closeView(); onPick(options[+b.dataset.i].value); });
    },
    items() { return fis(this.el); }
  };
}

/* --- opciones del juego (X) --- */
function propsView(g) {

    if (g.source === "steam" || (g.source === "xbox" && g.storeId)) s.push({ k: "store", label: "Ver en la tienda" });
    s.push({ k: "groups", label: "Grupos" });

    if (Host.has && g.kind !== "app") s.push({ k: "compat", label: "Compatibilidad de pantalla" });

    return s;
  };
  return {
    detail: true,
    hints() { const k = this.s && this.s[this.i] && this.s[this.i].k; const a = { ach: "Ver todos", art: "Elegir portada", store: "Abrir", close: "Cerrar", install: "Instalar", controls: "Configurar", groups: "Elegir", hide: isHidden(g) ? "Mostrar" : "Ocultar", pause: g.pause ? "Desactivar" : "Activar", compat: "Opciones", keepfocus: g.keepFocus ? "Desactivar" : "Activar" }[k]; return [["B", "Atrás"], ...(a ? [["A", a]] : [])]; },
    render(el) {
      this.s = sections();
      el.innerHTML = head(I.gear, g.name, "Opciones") + `<div class="props"><div class="pmenu">${this.s.map((s, i) => `<button class="lrow fi" data-i="${i}"><span class="meta"><b>${esc(s.label)}</b></span></button>`).join("")}</div><div class="ppane"></div></div>`;
      fis(el).forEach(b => b.onclick = () => this.act(this.s[+b.dataset.i].k));
    },
    onFocus(i) { const k = this.s[i].k; if (k !== this.cur) { this.cur = k; this.pane(k); } },
    pane(k) {

          <dt>Estado</dt><dd>${running ? "En ejecución" : d ? `${esc(d.kind)} ${Math.round(d.p * 100)} %` : g.installed ? "Instalado" : "No instalado"}</dd>
          <dt>Tiempo de uso</dt><dd>${(+g.hours || 0).toFixed(1)} h</dd>
          <dt>Última vez</dt><dd>${esc(g.last || "—")}</dd>
          ${hasAch(g) ? `<dt>Logros</dt><dd>${g.ach[0]} de ${g.ach[1]}</dd>` : ""}
          ${g.source === "steam" ? `<dt>ID de Steam</dt><dd>${g.appid}</dd>` : ""}</dl></div></div>`;
        Art.apply($(".pcover", p), g);
      } else if (k === "ach") {

          <b>Menú en la pantalla de Scarlet: ${g.fullMenu ? "sí" : "no"}.</b> Para juegos que solo tienen pantalla completa: el botón Xbox abre el menú en Scarlet (el juego se congela mientras tanto).<br><br>

/* --- actualizaciones desde GitHub --- */
let APP_VERSION = "0.4.19";
const updState = { available: false, latest: null };
function updateView() {
  return {
    hints() { return this.info && this.info.available && !this.busy ? [["B", "Atrás"], ["A", "Descargar e instalar"]] : [["B", "Atrás"]]; },
    render(el) {
      el.innerHTML = head(I.gear, "Actualizaciones") + `<div class="vbody"><div class="upd"><p class="note">Buscando la versión más nueva…</p></div></div>`;
      if (!Host.has) { $(".upd", el).innerHTML = `<p class="note">En la consola aquí se revisa GitHub y se instala la versión nueva.</p>`; return; }
      Host.call("update.check").then(r => { this.info = r || {}; this.paint(); }).catch(() => { this.info = { error: "No se pudo revisar." }; this.paint(); });
    },
    paint() {
      const r = this.info, box = $(".upd", this.el); if (!box) return;
      if (r.available) { updState.available = true; updState.latest = r.latest; }
      box.innerHTML = `<dl class="kv"><dt>Tienes</dt><dd>alpha ${esc(r.current || APP_VERSION)}</dd>${r.latest ? `<dt>Publicada</dt><dd>alpha ${esc(r.latest)}${r.sizeMb ? ` · ${r.sizeMb} MB` : ""}</dd>` : ""}</dl>
        ${r.error ? `<p class="note">${esc(r.error)}</p>` : r.available ? `<h2 style="margin-top:2rem">${esc(r.name || "Versión nueva")}</h2><p class="note" style="white-space:pre-wrap">${esc((r.notes || "").replace(/[#*`]/g, "").trim())}</p>
        <p class="note">Presiona A para descargarla. Scarlet se cerrará unos segundos y volverá a abrir ya actualizada. Tu configuración y portadas se quedan igual. Si la versión nueva fallara al abrir, se regresa sola a la que tienes ahora.</p>
        <div class="prog" style="display:none"><div class="bar"><i style="width:0"></i></div><span>0 %</span></div>` : `<p class="note">Ya tienes la versión más nueva.</p>`}`;
      updateFocus();
    },
    onKey(k) {
      if (k !== "a") return false;
      if (!this.info || !this.info.available || this.busy) { play("bump"); return true; }
      this.busy = true; play("select"); updateFocus();
      const pg = $(".prog", this.el); pg.style.display = "";
      const off = Events.on("update.progress", d => { $(".prog i", this.el).style.width = d.p * 100 + "%"; $(".prog span", this.el).textContent = d.p >= 1 ? "Instalando…" : Math.round(d.p * 100) + " %"; });
      Host.call("update.install").then(r => {
        if (r && r.ok) { $(".prog span", this.el).textContent = "Instalando… Scarlet se reinicia"; return; }
        off(); this.busy = false; toast((r && r.error) || "No se pudo actualizar"); this.paint();
      }).catch(() => { off(); this.busy = false; toast("No se pudo actualizar"); this.paint(); });
      return true;
    },
    onB() { return this.busy; },
    items() { return []; }
  };
}

/* --- elegir portada entre todas las de SteamGridDB --- */
const ART_MODES = [["square", "Cuadradas"], ["icons", "Íconos"], ["all", "Todas"]];
function artPickerView(g, onChosen) {
  const steam = (g.source || "steam") === "steam" && g.kind !== "app";
  const media = (u, cls = "") => /\.(webm|mp4)(\?|$)/i.test(u) ? `<video class="${cls}" src="${esc(u)}" autoplay loop muted playsinline></video>` : `<img class="${cls}" alt="" loading="lazy" src="${esc(u)}">`;
  return {
    cls: "apick", mode: 0, page: 0, list: [], done: false, loading: false, err: "",
    hints() { return [["B", "Atrás"], ["Y", ART_MODES[(this.mode + 1) % ART_MODES.length][1]], ["A", "Usar esta"]]; },
    render(el) {
      el.innerHTML = head(I.album, "Elegir portada", g.name) + `<div class="tabs"><span class="chip">Y</span>${ART_MODES.map(([, l], i) => `<span class="tab${i === this.mode ? " on" : ""}">${l}</span>`).join("")}</div><div class="vbody"><div class="grid"></div></div>`;
      this.reload();
    },
    reload() {
      this.page = 0; this.list = []; this.done = false; this.err = ""; this.i = 0; this.loading = false; this.gen = (this.gen || 0) + 1;
      $$(".tab", this.el).forEach((t, i) => t.classList.toggle("on", i === this.mode));
      this.draw(); this.more();
    },
    fixed() {
      const f = [];
      if (steam) f.push({ url: "steam", thumb: Art.steamUrl(g), label: "Oficial de Steam", vert: true });
      if (g.source === "xbox" && g.art) f.push({ url: "xbox", thumb: g.art, label: "Oficial de Xbox Store" });
      f.push({ url: "none", thumb: Art.placeholder(g), label: "Colores (sin imagen)" });
      return f;
    },
    tile(o, i, cur) {
      return `<button class="tile fi${o.vert || (o.w && o.h && o.h > o.w * 1.15) ? " vert" : ""}" data-i="${i}" style="--k:${i % 10}">${media(o.thumb)}${o.url === cur ? `<span class="ck">✓</span>` : ""}${o.anim ? `<span class="tag">Animada</span>` : o.label ? "" : o.w ? `<span class="tag">${o.w}×${o.h}</span>` : ""}<span class="cap">${esc(o.label || (o.author ? "por " + o.author : "SteamGridDB"))}</span></button>`;
    },
    status() {
      return this.loading ? "Buscando portadas…" : this.err ? this.err : this.done ? (this.list.length ? `${this.list.length} ${this.list.length === 1 ? "imagen" : "imágenes"} de SteamGridDB` : "SteamGridDB no tiene portadas de este tipo para este juego. Prueba con Y.") : "";
    },
    /* dibuja todo (o solo agrega las nuevas, para que no parpadeen las que ya están) */
    draw(append) {
      const grid = $(".grid", this.el), cur = Art.pick[g.appid] || "";
      const all = [...this.fixed(), ...this.list], from = append ? (this.all || []).length : 0;
      this.all = all;
      if (!append) grid.innerHTML = `<p class="more"></p>`;
      const more = $(".more", grid);
      more.insertAdjacentHTML("beforebegin", all.slice(from).map((o, k) => this.tile(o, from + k, cur)).join(""));
      more.textContent = this.status();
      fis(grid).slice(from).forEach(b => b.onclick = () => this.choose(this.all[+b.dataset.i]));
      // el arte oficial de Steam lo resuelve la app (los juegos nuevos ya no usan la dirección clásica)
      if (!append && Host.has && steam) Host.call("cache.image", { url: Art.steamUrl(g) }).then(u => { const im = $(".tile img", grid); if (u && im) im.src = u; }).catch(() => {});
      if (topView() === this) updateFocus();
    },
    async more() {
      if (this.loading || this.done) return;
      this.loading = true; $(".more", this.el).textContent = this.status();
      const gen = this.gen;
      try {
        const items = await Art.options(g, ART_MODES[this.mode][0], this.page);
        if (gen !== this.gen) return;
        const seen = new Set(this.list.map(x => x.url));
        const fresh = items.filter(x => x.url && !seen.has(x.url));
        this.list.push(...fresh); this.page++;
        if (!fresh.length) this.done = true;
      } catch (e) {
        if (gen !== this.gen) return;
        this.done = true;
        this.err = /key/i.test(String(e && e.message)) ? "Falta la API key de SteamGridDB (Ajustes › Cuentas y arranque)." : "No se pudo consultar SteamGridDB. Revisa tu conexión.";
      }
      this.loading = false;
      if (views.includes(this)) this.draw(true);
    },
    onFocus(i) { if (i >= (this.all || []).length - 10) this.more(); },
    async choose(o) {
      if (!o) return;
      play("select");
      await Art.choose(g, o.url);
      toast("Portada actualizada");
      closeView(); renderHome();
      const lv = views.find(v => v.refresh && v.list && v.cols === 6); if (lv) lv.refresh(true);
      if (onChosen) onChosen();
    },
    cols: 5,
    onKey(k) {
      if (k === "y") { this.mode = (this.mode + 1) % ART_MODES.length; play("select"); this.reload(); return true; }
      if (k === "lb" || k === "rb") {
        const n = this.items().length; if (!n) return true;
        const i = clamp(this.i + (k === "lb" ? -10 : 10), 0, n - 1);
        if (i === this.i) bump(this.items()[this.i], k === "lb" ? "up" : "down"); else { this.i = i; play("tab"); updateFocus(); }
        return true;
      }
      return false;
    },
    items() { return fis(this.el); }
  };
}

/* --- biblioteca: colecciones, orden y búsqueda --- */
const SORTS = ["Recientes", "A–Z", "Más jugados", "Solo instalados"];
const lib = { col: 0, sort: 0, query: "" };
function collections() {
  const names = [];
  games.forEach(g => (g.cols || []).forEach(c => { if (!names.includes(c)) names.push(c); }));
  const order = ["Favoritos", "Acción", "RPG", "Indies"];
  names.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const out = ["Todos", ...groupNames().filter(n => !names.includes(n)), ...names];
  if (games.some(g => g.kind === "app")) out.push("Aplicaciones");
  if (games.some(isHidden)) out.push("Ocultos");
  return out;
}
function libraryList(query = lib.query) {
  const cols = collections(), col = cols[clamp(lib.col, 0, cols.length - 1)], q = norm(query.trim());
  let list = games.filter(g => col === "Ocultos" ? isHidden(g) : isHidden(g) ? false : col === "Todos" ? true : col === "Aplicaciones" ? g.kind === "app" : (g.cols || []).includes(col) || inGroup(g, col));
  if (q) list = list.filter(g => norm(g.name).includes(q));
  if (lib.sort === 1) list = [...list].sort((a, b) => a.name.localeCompare(b.name, "es"));
  else if (lib.sort === 2) list = [...list].sort((a, b) => (b.hours || 0) - (a.hours || 0));
  else if (lib.sort === 3) list = list.filter(g => g.installed);
  return list;
}
function libraryView() {
  return {
    cols: 6,
    hints() { return [["B", lib.query ? "Quitar búsqueda" : "Atrás"], ["Y", "Ordenar"], ["☰", "Buscar"], ["X", "Opciones"], ["A", "Iniciar"]]; },

      if (!this.list.length) grid.outerHTML = `<div class="grid"><p class="empty" style="grid-column:1/-1">No hay nada por aquí.</p></div>`;

    items() { return fis(this.el); }
  };
}

/* --- teclado en pantalla --- */
/* opt: { title, placeholder, max, keys: "text" | "digits" | "hexUpper" | "hexLower", paste } */
function keyboardView(initial, onDone, countFor, opt = {}) {
  const tail = opt.paste ? ["Pegar", "Borrar", "Listo"] : ["Espacio", "Borrar", "Listo"];
  const rows = opt.keys === "digits" ? [[..."1234567890"], tail]
    : opt.keys === "hexUpper" ? [[..."1234567890"], [..."ABCDEF"], tail]
    : opt.keys === "hexLower" ? [[..."1234567890"], [..."abcdef"], tail]
    : [[..."1234567890"], [..."qwertyuiop"], [..."asdfghjklñ"], [..."zxcvbnm-'."], tail];
  const last = rows.length - 1, max = opt.max || 40;
  const flatIndex = (r, c) => rows.slice(0, r).reduce((s, x) => s + x.length, 0) + c;
  return {
    text: initial || "", r: rows.length > 2 ? 1 : 0, c: 0, i: flatIndex(rows.length > 2 ? 1 : 0, 0),
    hints: [["B", "Borrar"], ["Y", opt.paste ? "Pegar" : "Espacio"], ["☰", "Listo"], ["A", "Escribir"]],
    render(el) {
      el.innerHTML = head(opt.title ? I.gear : I.search, opt.title || "Buscar en la biblioteca") + `<div class="kb"><div class="kbfield"><span class="kbtext"></span><i class="caret"></i></div><div class="kbcount"></div><div class="kbrows">${rows.map((row, ri) => `<div class="kbrow">${row.map((k, ci) => `<button class="key fi${ri === last ? " wide" : ""}${k === "Listo" ? " ok" : ""}" data-r="${ri}" data-c="${ci}">${esc(k)}</button>`).join("")}</div>`).join("")}</div></div>`;
      fis(el).forEach(b => b.onclick = () => { this.r = +b.dataset.r; this.c = +b.dataset.c; this.press(); });
      this.upd();
    },
    syncFromIndex() { let n = this.i; for (let r = 0; r < rows.length; r++) { if (n < rows[r].length) { this.r = r; this.c = n; return; } n -= rows[r].length; } },
    upd() {
      const t = $(".kbtext", this.el);
      t.innerHTML = this.text ? esc(this.text) : `<span class="ph">${esc(opt.placeholder || "Nombre del juego…")}</span>`;
      if (countFor) { const n = countFor(this.text); $(".kbcount", this.el).textContent = this.text ? `${n} resultado${n === 1 ? "" : "s"}` : ""; }
      else $(".kbcount", this.el).textContent = opt.max ? `${this.text.length} / ${opt.max}` : "";
    },
    press() {
      const k = rows[this.r][this.c];
      if (k === "Espacio") this.type(" ");
      else if (k === "Pegar") this.paste();
      else if (k === "Borrar") this.del();
      else if (k === "Listo") this.done();
      else this.type(k);
    },
    type(ch) { if (this.text.length >= max) return play("bump"); this.text += ch; play("type"); this.upd(); },
    async paste() {
      const t = Host.has ? await Host.call("clipboard.get").catch(() => "") : await navigator.clipboard?.readText?.().catch(() => "");
      const clean = String(t || "").trim().slice(0, max);
      if (!clean) { toast("No hay texto copiado"); return play("bump"); }
      this.text = clean; play("select"); this.upd();
    },
    del() { if (!this.text) return play("bump"); this.text = this.text.slice(0, -1); play("back"); this.upd(); },
    done() { closeView(); onDone(this.text); },
    nav(dir) {
      let r = this.r, c = this.c;
      if (dir === "left") c--; else if (dir === "right") c++;
      else {
        const nr = r + (dir === "down" ? 1 : -1);
        if (nr < 0 || nr >= rows.length) return bump(this.items()[this.i], dir);
        c = Math.round(c * (rows[nr].length - 1) / Math.max(1, rows[r].length - 1)); r = nr;
      }
      if (c < 0 || c >= rows[r].length) return bump(this.items()[this.i], dir);
      this.r = r; this.c = c; this.i = flatIndex(r, c); play("move"); updateFocus();
    },
    onKey(k) {
      if (k === "x") { this.del(); return true; }
      if (k === "y") { opt.paste ? this.paste() : this.type(" "); return true; }
      if (k === "start") { this.done(); return true; }
      return false;
    },
    onB() { if (!this.text) return false; this.del(); return true; },
    onType(ch) {
      if (opt.keys === "digits" && !/\d/.test(ch)) return play("bump");
      if (/^hex/.test(opt.keys || "") && !/[0-9a-f]/i.test(ch)) return play("bump");
      ch = opt.keys === "hexUpper" ? ch.toUpperCase() : ch.toLowerCase();
      this.type(ch);
    },
    items() { return fis(this.el); }
  };
}

/* --- álbum: filtros por tipo y juego, borrar --- */
const ATYPES = ["Todo", "Fotos", "Videos"];
const albumFilter = { type: 0, game: null };
const albumList = () => (albumData || []).filter(c => (albumFilter.type === 0 || (albumFilter.type === 1 ? c.type !== "video" : c.type === "video")) && (!albumFilter.game || c.game === albumFilter.game));
function albumView() {

    render(el) {

    refresh() {

      fis(this.el).forEach(b => b.onclick = () => {
        if (!this.sel) return openView(viewerView(this, +b.dataset.i));
        const c = this.list[+b.dataset.i]; if (!c || c.url.startsWith("data:") && Host.has) return play("bump");
        if (this.sel.has(c.path)) this.sel.delete(c.path); else this.sel.add(c.path);
        b.classList.toggle("on", this.sel.has(c.path)); play("select"); updateFocus();
      });

    },
    onKey(k) {

        if (!this.list || !this.list.length) return play("bump"), true;
        if (!this.sel) { this.sel = new Set([this.list[this.i].path]); play("select"); toast("Marca con A lo que quieras enviar y presiona ☰"); }
        else if (!this.sel.size) { play("bump"); return true; }

        this.refresh(); this.i = clamp(this.i, 0, this.list.length - 1); updateFocus(); return true;
      }

      return false;
    },
    onB() { if (!this.sel) return false; this.sel = null; play("back"); const i = this.i; this.refresh(); this.i = i; updateFocus(); return true; },
    onX() {

function viewerView(album, idx) {
  return {
    cls: "viewer", idx,
    hints() {
      return this.vid
        ? [["B", "Atrás"], ["☰", "Más"], ["A", this.vid.paused ? "Reproducir" : "Pausa"], ["◀", "−5 s"], ["▶", "+5 s"], ["LB", "Anterior"], ["RB", "Siguiente"]]
        : [["B", "Atrás"], ["☰", "Más"], ["X", "Borrar"], ["◀", "Anterior"], ["▶", "Siguiente"]];
    },
    render(el) { el.innerHTML = `<div class="vwrap"><div class="media" style="display:contents"></div><div class="vcap"></div></div>`; this.show(); },
    show() {
      const list = album.list, c = list[this.idx], m = $(".media", this.el);
      this.stop();
      if (c.type === "video" && !c.url.startsWith("data:")) this.player(m, c.url);
      else m.innerHTML = `<img alt="" src="${esc(c.url)}">`;
      $(".vcap", this.el).textContent = `${c.game} · ${c.date} · ${this.idx + 1} de ${list.length}${c.type === "video" ? " · video" : ""}`;
      updateFocus();
    },
    /* Reproductor propio: la barra se esconde sola mientras corre y vuelve con cualquier botón. */
    player(m, url) {
      const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1"/><rect x="14" y="4.5" width="4.5" height="15" rx="1"/></svg>';
      m.innerHTML = `<div class="vplayer paused wait"><video src="${esc(url)}" autoplay playsinline preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>
        <div class="vbig play">${PLAY}</div><div class="vbig load"><i></i></div>
        <div class="vctl"><span class="pp">${PLAY}</span><span class="t cur">0:00</span><div class="vbar"><i class="buf"></i><i class="fill"></i><i class="knob"></i></div><span class="t r dur">0:00</span></div></div>`;
      const box = $(".vplayer", m), v = $("video", box), bar = $(".vbar", box);
      const fmt = s => !isFinite(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      const paint = () => {
        const d = v.duration || 0, p = d ? v.currentTime / d * 100 : 0;
        $(".fill", bar).style.width = p + "%"; $(".knob", bar).style.left = p + "%";
        if (d && v.buffered.length) $(".buf", bar).style.width = v.buffered.end(v.buffered.length - 1) / d * 100 + "%";
        $(".cur", box).textContent = fmt(v.currentTime); $(".dur", box).textContent = fmt(d);
      };
      const state = () => { box.classList.toggle("paused", v.paused); $(".pp", box).innerHTML = v.paused ? PLAY : PAUSE; this.wake(); updateFocus(); };
      v.addEventListener("timeupdate", paint); v.addEventListener("progress", paint); v.addEventListener("loadedmetadata", paint);
      v.addEventListener("play", state); v.addEventListener("pause", state); v.addEventListener("ended", state);
      v.addEventListener("waiting", () => box.classList.add("wait"));
      ["playing", "canplay", "seeked"].forEach(e => v.addEventListener(e, () => box.classList.remove("wait")));
      v.addEventListener("error", () => { box.classList.remove("wait"); box.insertAdjacentHTML("beforeend", `<p class="verr">No se pudo reproducir este video.<br><small>Puede que el formato no sea compatible (H.264 / VP9 sí lo son).</small></p>`); });
      v.addEventListener("click", () => this.toggle());
      bar.addEventListener("click", e => { const r = bar.getBoundingClientRect(); if (v.duration) v.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * v.duration; this.wake(); });
      box.addEventListener("pointermove", () => this.wake());
      this.vid = v; this.box = box;
      v.play().catch(() => state());
      this.wake();
    },
    wake() {
      if (!this.box) return;
      this.box.classList.remove("idle"); clearTimeout(this.idleT);
      this.idleT = setTimeout(() => { if (this.vid && !this.vid.paused) this.box.classList.add("idle"); }, 2600);
    },
    toggle() { const v = this.vid; if (!v) return; if (v.paused || v.ended) { if (v.ended) v.currentTime = 0; v.play().catch(() => {}); play("select"); } else { v.pause(); play("tick"); } },
    seek(s) { const v = this.vid; if (!v || !v.duration) return play("bump"); v.currentTime = clamp(v.currentTime + s, 0, v.duration - 0.05); play("tick"); this.wake(); },
    stop() { if (this.vid) { try { this.vid.pause(); this.vid.removeAttribute("src"); this.vid.load(); } catch {} } this.vid = this.box = null; clearTimeout(this.idleT); },
    go(d) {
      const n = this.idx + d;
      if (n < 0 || n >= album.list.length) return bump($(".vwrap img, .vwrap .vplayer", this.el), d > 0 ? "right" : "left");
      this.idx = n; play("move"); this.show();
    },
    more() {
      const c = album.list[this.idx]; if (!c) return;
      if (this.vid && !this.vid.paused) this.vid.pause();
      const opts = [{ label: "Enviar al celular (código QR)", value: "share" }, { label: "Copiar (para pegar en Discord, WhatsApp…)", value: "copy" }];
      if (c.type === "video") opts.push({ label: "Recortar video", value: "trim" });
      opts.push({ label: c.type === "video" ? "Borrar grabación" : "Borrar captura", value: "del" });
      openView(pickerView("Opciones", I.album, opts, null, v => {
        if (v === "share") openView(shareView([c.path]));
        else if (v === "copy") Host.has ? Host.call("album.copy", { path: c.path }).then(ok => toast(ok ? "Copiada: pégala con Ctrl+V" : "No se pudo copiar")).catch(() => toast("No se pudo copiar")) : toast("Copiada (demo)");
        else if (v === "trim") { this.stop(); openView(trimView(c, item => { albumData.unshift(item); album.refresh(); this.idx = Math.max(0, album.list.indexOf(c)); this.show(); })); }
        else if (v === "del") this.onX();
      }));
    },
    onKey(k) {
      if (this.vid) this.wake();
      if (k === "start") { this.more(); return true; }
      if (k === "a" && this.vid) { this.toggle(); return true; }
      if (k === "lb" || k === "rb") { this.go(k === "lb" ? -1 : 1); return true; }
      return false;
    },
    nav(d) {
      if (d !== "left" && d !== "right") return false;
      if (this.vid) this.seek(d === "right" ? 5 : -5); else this.go(d === "right" ? 1 : -1);
    },
    onB() { this.stop(); return false; },
    onX() {
      const c = album.list[this.idx];
      confirmDialog(`¿Borrar esta ${c.type === "video" ? "grabación" : "captura"}?\nNo se puede deshacer.`, "Borrar").then(ok => {
        if (!ok) return;
        this.stop();   // suelta el archivo antes de borrarlo
        Host.call("album.delete", { path: c.path }).catch(() => {});
        albumData = albumData.filter(x => x !== c); album.refresh();
        if (!album.list.length) return closeView();
        this.idx = Math.min(this.idx, album.list.length - 1); this.show(); toast("Se borró la captura");
      });
      return true;
    },
    items() { return []; }
  };
}

/* Recortar video: dos marcas (inicio y fin) sobre la línea de tiempo; se guarda como un video nuevo. */
function trimView(c, onSaved) {
  return {
    hints() { return [["B", "Cancelar"], ["A", this.h ? "Mover inicio" : "Mover fin"], ["◀▶", "±1 s"], ["LB RB", "±5 s"], ["Y", "Ver recorte"], ["☰", "Guardar"]]; },
    render(el) {
      el.innerHTML = head(I.album, "Recortar video", c.game) + `<div class="trim"><video src="${esc(c.url)}" playsinline preload="auto"></video>
        <div class="tline"><i class="sel"></i><i class="ph"></i><i class="h a on"></i><i class="h b"></i></div>
        <div class="tinfo"><span>Inicio <b class="ta">0:00</b></span><span>Duración <b class="td">0:00</b></span><span>Fin <b class="tb">0:00</b></span></div></div>`;
      const v = $("video", el);
      this.v = v; this.a = 0; this.b = 0; this.h = 0;
      v.addEventListener("loadedmetadata", () => { this.b = v.duration || 0; this.paint(); });
      v.addEventListener("timeupdate", () => { if (this.preview && v.currentTime >= this.b) { v.pause(); this.preview = false; } this.paint(); });
    },
    paint() {
      const d = this.v.duration || 1, el = this.el, pa = this.a / d * 100, pb = this.b / d * 100;
      $(".sel", el).style.cssText = `left:${pa}%;width:${pb - pa}%`;
      $(".h.a", el).style.left = pa + "%"; $(".h.b", el).style.left = pb + "%";
      $(".h.a", el).classList.toggle("on", this.h === 0); $(".h.b", el).classList.toggle("on", this.h === 1);
      $(".ph", el).style.left = this.v.currentTime / d * 100 + "%";
      $(".ta", el).textContent = mmss(this.a); $(".tb", el).textContent = mmss(this.b); $(".td", el).textContent = mmss(this.b - this.a);
    },
    move(s) {
      const d = this.v.duration || 0; if (!d) return play("bump");
      if (this.h === 0) this.a = clamp(this.a + s, 0, Math.max(0, this.b - 1)); else this.b = clamp(this.b + s, Math.min(d, this.a + 1), d);
      this.v.pause(); this.preview = false; this.v.currentTime = this.h === 0 ? this.a : this.b;
      play("tick"); this.paint();
    },
    nav(d) { if (d === "left" || d === "right") { this.move(d === "right" ? 1 : -1); return; } return false; },
    onKey(k) {
      if (k === "a") { this.h = 1 - this.h; play("move"); this.v.currentTime = this.h ? this.b : this.a; this.paint(); updateFocus(); return true; }
      if (k === "lb" || k === "rb") { this.move(k === "rb" ? 5 : -5); return true; }
      if (k === "y") { this.v.currentTime = this.a; this.preview = true; this.v.play().catch(() => {}); play("select"); return true; }
      if (k === "start") { this.save(); return true; }
      return false;
    },
    async save() {
      if (this.saving) return;
      if (!Host.has) { toast("En la consola aquí se guarda el recorte"); return; }
      this.saving = true; this.v.pause(); toast("Guardando recorte…");
      const r = await Host.call("album.trim", { path: c.path, start: this.a, end: this.b }).catch(() => null);
      this.saving = false;
      if (!r || !r.ok) { play("bump"); return toast((r && r.error) || "No se pudo recortar"); }
      play("select"); toast("Recorte guardado en el Álbum"); closeView(); onSaved && onSaved(r.item);
    },
    onB() { this.v.pause(); return false; },
    items() { return []; }
  };
}

function btView() {
  return {
    found: [], timers: [], hints: [["B", "Atrás"], ["A", "Emparejar"]],
    render(el) {
      el.innerHTML = head(I.bt, "Conectar un mando") + `<div class="vbody"><div class="bthelp">${I.bt}<div>Pon tu mando en modo de emparejamiento. En un mando Xbox, mantén el botón de sincronización (arriba, junto al puerto USB) hasta que el logo parpadee rápido.</div></div><div class="sect">Mandos encontrados</div><div class="btlist"></div></div>`;

      this.paint();

        Host.call("bt.scan").catch(() => {});

        return;

    },

function pollPads(t) {

  // la app (pad.key, si el juego se lo quedó). Cada vez que se abre, el que llegue primero se usa y el otro se ignora,
  // para que nada cuente doble y el menú siempre responda.
  const list = navigator.getGamepads && !(OVERLAY && Host.has && QM.src === "host") ? [...navigator.getGamepads()].filter(Boolean) : [];
  const p = list[0];
  if (p) {
    lastPad = p;
    const B = i => list.some(g => g.buttons[i] && (g.buttons[i].pressed || g.buttons[i].value > .5));
    const ax = [0, 1].map(i => list.reduce((m, g) => Math.abs(g.axes[i] || 0) > Math.abs(m) ? g.axes[i] : m, 0));
    const dirs = { up: B(12) || ax[1] < -.55, down: B(13) || ax[1] > .55, left: B(14) || ax[0] < -.55, right: B(15) || ax[0] > .55 };
    for (const d in dirs) {

        if (!pad.held[d]) { pad.held[d] = true; pad.next[d] = t + 360; padInput(d); }
        else if (t >= pad.next[d]) { pad.next[d] = t + 105; padInput(d); }
      } else pad.held[d] = false;
    }
    // distribución Xbox: A0 B1 X2 Y3 LB4 RB5 LT6 RT7 Menú9 Xbox16 (el botón Xbox lo manda el anfitrión en la app real)
    const btns = { a: 0, b: 1, x: 2, y: 3, lb: 4, rb: 5, lt: 6, rt: 7, start: 9 };
    for (const k in btns) { const pr = B(btns[k]); if (pr && !pad.held[k]) padInput(k); pad.held[k] = pr; }

    if (!Host.has) { const gd = B(16); if (gd && !pad.held.guide) guideDown(); else if (!gd && pad.held.guide) guideUp(); pad.held.guide = gd; }

}

addEventListener("gamepaddisconnected", e => {
  const p = state.pads.find(x => x.gp === e.gamepad.index && x.gp > 0);
  if (p) { state.pads = state.pads.filter(x => x !== p); renumberPads(); updatePadName(); refreshControls(); }
  if (mode !== "boot") notify({ icon: I.pad, title: "Mando desconectado", text: p ? p.name : "Vuelve a conectarlo para seguir jugando" });
});
Events.on("pad.connected", p => { state.pads = state.pads.filter(x => x.key !== p.key).concat(p); updatePadName(); refreshControls(); notify({ icon: I.pad, title: "Mando conectado", text: `${p.name} · Jugador ${p.player}` }); });
Events.on("pad.disconnected", p => { state.pads = state.pads.filter(x => x.key !== p.key); renumberPads(); updatePadName(); refreshControls(); notify({ icon: I.pad, title: "Mando desconectado", text: p.name }); });

document.addEventListener("click", e => { Snd.ensure(); if (activity()) return; if (QM.open) { if (e.target.id === "qshade") closeQuick(); return; } if (mode === "ui") onHomeClick(e); }, true);
addEventListener("mousemove", () => { if (!dimmed) lastActivity = performance.now(); });
$("#boot").addEventListener("click", e => { e.stopPropagation(); dismissBoot(); });

/* ================= estado del sistema ================= */
function clockText(d = new Date()) {
  const m = String(d.getMinutes()).padStart(2, "0");
  if (settings.clock24 !== false) return String(d.getHours()).padStart(2, "0") + ":" + m;
  const h = d.getHours() % 12 || 12;
  return `${h}:${m} ${d.getHours() < 12 ? "a.m." : "p.m."}`;
}
function tick() {
  $$(".clock").forEach(c => c.textContent = clockText());
  $$(".wifi").forEach(w => w.style.opacity = navigator.onLine && (typeof sys === "undefined" || (sys.wifi && !sys.airplane)) ? 1 : .3);
  if (typeof QM !== "undefined" && QM.open) renderQuick();
}
setInterval(tick, 10000); tick();
/* Avisos al 20 % y al 10 % (cada uno una vez por descarga) y aviso al conectar el cargador. */
const battWarn = { 20: false, 10: false };
function setBatt(level, charging) {
  const wasCharging = deviceCharging;
  deviceBatt = level; deviceCharging = !!charging;
  $$(".battPct").forEach(e => e.textContent = Math.round(level * 100) + "%");
  $$(".battFill").forEach(e => { e.setAttribute("width", Math.max(1.5, 20.6 * level)); e.setAttribute("fill", level <= .15 && !charging ? "#e5484d" : charging ? "#3ad16b" : "currentColor"); });
  $$(".battBolt").forEach(e => e.style.display = charging ? "" : "none");
  if (mode === "boot") return;
  for (const t of [10, 20]) {
    if (!charging && level <= t / 100 && !battWarn[t]) { battWarn[10] = level <= .1; battWarn[20] = true; notifyBattery(level); break; }
  }
  if (charging || level > .25) { battWarn[20] = false; battWarn[10] = false; }
  else if (level > .12) battWarn[10] = false;
  if (charging && !wasCharging && typeof battReady !== "undefined" && battReady) notify({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/></svg>', title: "Cargando", text: `Batería al ${Math.round(level * 100)} %` });
}
let battReady = false; setTimeout(() => battReady = true, 4000);
if (navigator.getBattery) navigator.getBattery().then(b => { const u = () => setBatt(b.level, b.charging); u(); b.addEventListener("levelchange", u); b.addEventListener("chargingchange", u); }).catch(() => setBatt(.82)); else setBatt(.82);
addEventListener("resize", () => updateFocus());

/* ================= arranque ================= */
const bootStart = performance.now();
function dismissBoot() {
  if (mode !== "boot" || performance.now() - bootStart < 700) return;
  mode = "ui";
  $("#boot").classList.add("gone"); play("boot");
  renderHome();
  if (state.running && state.adopted) {   // la app se reinició con un juego abierto: se regresa a él
    state.adopted = false; showGame(runningGame()); mode = "game";
    Host.call("game.focus").catch(() => {});
  }
  if (!Host.has) {
    setTimeout(() => demoFriendOnline(), 7000); setInterval(() => demoFriendOnline(), 45000);
    setTimeout(() => { const g = byId(2246340); if (g && !state.downloads[g.appid]) { state.downloads[g.appid] = { p: .3, kind: "Actualizando" }; renderHome(); } }, 2500);
  }
}
Events.on("library.changed", async () => {
  const keep = focusedGame(); games = await Data.games();
  if (keep) { const i = homeGames().findIndex(g => g.appid === keep.appid); if (i >= 0) home.g = i; }
  if (mode !== "boot") renderHome();
  const lv = views.find(v => v.cols === 6 && v.refresh); if (lv) lv.refresh(true);
});
Events.on("profile.changed", p => { profile = p; renderUsers(); updateFocus(); });
Events.on("friends.changed", list => { if (Array.isArray(list)) { friends.length = 0; friends.push(...list); } });
(async function start() {
  if (OVERLAY) {   // solo el menú rápido: sin pantalla de inicio ni carga de juegos
    $("#boot").remove(); mode = "ui";
    const st = Host.has ? await Host.call("system.state").catch(() => null) : null;
    if (st) { mergeSys(st); saveSys(); }
    if (Host.has) Host.call("sounds.list").then(m => { if (m && Object.keys(m).length) Snd.loadCustom(m); }).catch(() => {});
    if (Host.has) Host.call("app.info").then(i => { DOLBY = !!(i && i.dolby); }).catch(() => {});
    if (!Host.has) { DOLBY = true; ATMOS = true; demoMedia(); openQuick(); }
    return;
  }
  [profile, games, friends] = await Promise.all([Data.profile(), Data.games(), Data.friends()]);
  if (Host.has) {
    const pads = await Host.call("pads.list").catch(() => null); if (pads && pads.length) state.pads = pads;
    Host.call("audio.mutebehind", { on: settings.muteBehind !== false }).catch(() => {});
    Host.call("cursor.hide", { on: settings.hideCursor !== false }).catch(() => {});
    const st = await Host.call("system.state").catch(() => null); if (st) { mergeSys(st); saveSys(); }
    Host.call("sounds.list").then(m => { if (m && Object.keys(m).length) Snd.loadCustom(m); }).catch(() => {});
    Host.call("sounds.info").then(i => { soundPack = (i && i.pack) || null; }).catch(() => {});
    const gs = await Host.call("game.state").catch(() => null);
    if (gs && gs.appid && byId(gs.appid)) { state.running = gs.appid; state.adopted = !!gs.ready; }
  }
  updatePadName();
  renderUsers();
  if (mode !== "boot") renderHome();
  if (Host.has) setTimeout(dismissBoot, 2200);
  const info = Host.has ? await Host.call("app.info").catch(() => null) : null;
  DOLBY = !!(info && info.dolby); paintDolby();
  if (info && info.version) APP_VERSION = String(info.version).replace(/\.0$/, "");
  if (info && info.updated) setTimeout(() => notify({ icon: I.gear, title: "Scarlet se actualizó", text: `Ya tienes la alpha ${APP_VERSION}` }), 3000);
  if (info && info.rolledBack) setTimeout(() => notify({ icon: I.gear, title: "Se regresó a la versión anterior", text: `La alpha ${info.rolledBack} no abrió bien; sigues con la alpha ${APP_VERSION}` }), 3000);
  if (Host.has && Date.now() - (settings.updChecked || 0) > 864e5) setTimeout(() => Host.call("update.check").then(r => {
    settings.updChecked = Date.now(); saveSettings();
    if (r && r.available) { updState.available = true; updState.latest = r.latest; notify({ icon: I.gear, title: "Hay una actualización", text: `alpha ${r.latest} · Ajustes › Buscar actualizaciones` }); }
  }).catch(() => {}), 15000);
  if (Host.has && settings.bootLast) {   // al encender: directo al último juego (solo si la consola acaba de arrancar)
    const last = info && info.startup && !state.running && games.find(g => g.kind !== "app" && g.installed && !isHidden(g));
    if (last) setTimeout(() => { if (mode === "ui" && !state.running) { toast("Abriendo " + last.name); launchGame(last); } }, 2600);
  }
})();
</script>
</body>
</html>
