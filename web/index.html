<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scarlet</title>
<!--
  Scarlet · alpha 0.3 (proyecto personal)
  Home estilo consola híbrida para la ROG Xbox Ally X. Íconos de la interfaz,
  sonidos (sintetizados) y portadas de respaldo son propios del proyecto.

  Controles en navegador (en paréntesis, el botón de la Ally):
    Flechas ........ moverse            Enter (A) ..... iniciar / aceptar
    Esc (B) ........ atrás / borrar     X (X) ......... opciones / borrar
    Y (Y) .......... ordenar / tipo     M (Menú) ...... ajustes · en biblioteca: buscar
    Q / E (LB/RB) .. saltar             Z / C (LT/RT) . cambiar colección
    H H (Xbox ×2) .. volver al menú / al juego          P ............. suspender
    Mantener H ..... menú rápido (brillo, volumen, energía, Wi-Fi)
    K .............. captura · mantener K = guardar video (solo jugando)
    Bloqueo ........ el mismo botón tres veces

  Contrato con la app anfitriona (C# + WebView2):
    UI → host  postMessage({ id, type, payload })  ·  host → UI { id, ok, data | error }
      steam.profile → {name, level, avatarUrl}      steam.games → [{appid, name, source, kind, installed,
      hours, last, ach:[u,t], cols:[...]}]          steam.friends · steam.achievements {appid}
      game.launch {appid, source} · game.focus · game.close · steam.open {url}
      sgdb {path} · album.list → [{url, thumb, path, game, date, type}] · album.delete {path}
      rumble {strong, weak, ms} · ui.show · system.sleep
      system.open {uri}  (steam://store, ms-settings:bluetooth, explorer…) · system.armoury (abre Armoury Crate)
      pads.list → [{key, name, type, player, battery}] · pad.player {key, player} · pad.rumble {key} · pad.disconnect {key}
      bt.scan → inicia búsqueda (eventos bt.found)  ·  bt.pair {id}
      Las apps (kind:"app") traen exec, p. ej. YouTube: msedge --app=https://www.youtube.com/tv --start-fullscreen
    host → UI eventos { event, data }
      game.ready · game.exited · guide.double · friend.online · system.resumed · battery.low
      achievement.unlocked {appid, name, desc} · download.progress {appid, progress, kind} · download.done {appid}
      pad.connected · pad.disconnected · bt.found {id, name} · bt.paired {id}
-->
<style>
:root{
  --bg:#2b2b2f; --bg2:#38383d; --fg:#f4f4f6; --fg2:#a9a9b0; --line:#47474d;
  --tile:#3a3a40; --accent:#3ad7ff; --accent2:#9ef0ff; --icon:#45454c; --iconfg:#f4f4f6;
  --shadow:0 .5rem 1.4rem rgba(0,0,0,.38); --pad:4.6rem;
}
:root[data-theme="light"]{
  --bg:#ececec; --bg2:#ffffff; --fg:#2c2c2e; --fg2:#6d6d72; --line:#cfcfd2;
  --tile:#d8d8dc; --accent:#00b2ec; --accent2:#5fd4ff; --icon:#ffffff; --iconfg:#3a3a3e;
  --shadow:0 .35rem 1rem rgba(0,0,0,.14);
}
html{font-size:min(.84vw,1.5vh)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;transition:background .3s,color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
svg{display:block}

#app{position:relative;height:100vh;width:100vw;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);overflow:hidden}

/* ---------- barra superior ---------- */
.top{display:flex;justify-content:space-between;align-items:center;padding:2.8rem var(--pad) 0}
.users{display:flex;gap:1.2rem}
.avatar{--r:50%;width:4.6rem;height:4.6rem;border-radius:50%;position:relative;background:linear-gradient(140deg,#ff9d4a,#ff4f86);display:grid;place-items:center;font-weight:800;font-size:1.9rem;color:#fff;box-shadow:var(--shadow)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar img.aframe{position:absolute;inset:-17%;width:134%;height:134%;border-radius:0;pointer-events:none}
.fav img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status{display:flex;align-items:center;gap:1.6rem;font-size:1.7rem;font-weight:700}
.status svg{height:1.9rem;width:auto}
.batt{display:flex;align-items:center;gap:.6rem}

/* ---------- home ---------- */
.home{display:flex;flex-direction:column;justify-content:center;min-height:0;min-width:0}
.rowwrap,.titlebar{width:100%;min-width:0}
.titlebar{height:3.4rem;position:relative;margin-bottom:.6rem}
#gameTitle{position:absolute;left:0;bottom:0;font-size:2.1rem;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-align:center;line-height:1.35;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .15s}
/* texto que se desplaza cuando no cabe */
.mq{display:inline-flex;gap:var(--mqgap,3.2rem);will-change:transform}
.mqbox.scroll{text-align:left;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mqbox.scroll .mq{animation:mq var(--mqdur,8s) linear .9s infinite}
@keyframes mq{0%,16%{transform:none}100%{transform:translateX(var(--mqd))}}
.rowwrap{overflow:hidden;padding:1.1rem 0}
.track{position:relative;display:flex;align-items:center;gap:1.4rem;padding:0 var(--pad);transition:transform .24s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tile{--r:1rem;flex:0 0 auto;width:20.5rem;height:20.5rem;border-radius:1rem;background:var(--tile);position:relative;box-shadow:var(--shadow);animation:tileIn .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 35ms)}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.tile.uninst img{filter:grayscale(.55) brightness(.72)}
.badge{position:absolute;width:3.2rem;height:3.2rem;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;color:#fff}
.badge svg{width:1.6rem;height:1.6rem}
.run{left:.9rem;bottom:.9rem}.run svg{width:1.3rem;margin-left:.2rem}
.cloud{right:.9rem;top:.9rem}
.dl{position:absolute;left:.9rem;right:.9rem;bottom:.9rem;background:rgba(0,0,0,.72);border-radius:.6rem;padding:.6rem .8rem .7rem;color:#fff;font-size:1.2rem;font-weight:700;display:flex;flex-direction:column;gap:.45rem}
.dl b{display:block;height:.5rem;background:rgba(255,255,255,.25);border-radius:99rem;overflow:hidden}
.dl i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s}
.tile.all{width:10.5rem;height:10.5rem;border-radius:50%;--r:50%;background:var(--icon);display:grid;place-items:center;color:var(--iconfg);margin-left:.6rem}
.tile.all svg{width:4rem;height:4rem}
@keyframes tileIn{from{opacity:0;transform:translateX(2.5rem)}to{opacity:1;transform:none}}

.apps{display:flex;justify-content:center;gap:2.4rem;margin-top:4.4rem}
.app{--r:50%;width:6.6rem;height:6.6rem;border-radius:50%;background:var(--icon);display:grid;place-items:center;box-shadow:var(--shadow);position:relative;color:var(--c,var(--iconfg))}
.app svg{width:3.1rem;height:3.1rem}
.app .lbl{position:absolute;top:calc(100% + 1.2rem);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:1.5rem;font-weight:700;color:var(--accent);opacity:0;transition:opacity .12s;pointer-events:none}
.app.focused .lbl{opacity:1}

/* ---------- anillo de selección y eco ---------- */
.focused::after{content:"";position:absolute;inset:-.7rem;border-radius:calc(var(--r,1rem) + .7rem);border:.42rem solid var(--accent);pointer-events:none;animation:ring 1.5s ease-in-out infinite;z-index:2}
.avatar.focused::after,.app.focused::after,.tile.all.focused::after{border-radius:50%}
@keyframes ring{0%,100%{border-color:var(--accent);box-shadow:0 0 .2rem 0 transparent}50%{border-color:var(--accent2);box-shadow:0 0 1.4rem .1rem color-mix(in srgb,var(--accent) 45%,transparent)}}
.echo{position:fixed;z-index:47;border:.5rem solid var(--accent);pointer-events:none;animation:echo .8s cubic-bezier(.15,.7,.3,1) both}
@keyframes echo{from{opacity:.95;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}

/* ---------- pie con ayudas ---------- */
.hints{margin:0 var(--pad);border-top:1px solid var(--line);height:7.4rem;display:flex;align-items:center;justify-content:space-between;font-size:1.6rem;font-weight:700;position:relative;z-index:6;background:var(--bg);transition:background .3s}
.hints .left{display:flex;align-items:center;gap:1.2rem;color:var(--fg2)}
.padicon{height:3.4rem;aspect-ratio:420/182;background:currentColor;-webkit-mask:var(--padimg) center/contain no-repeat;mask:var(--padimg) center/contain no-repeat}
.hint{display:inline-flex;align-items:center;gap:.7rem;margin-left:2.4rem}
.glyph{min-width:2.4rem;height:2.4rem;padding:0 .5rem;border-radius:99rem;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:1.15rem;font-weight:900;line-height:1}

/* ---------- pantallas secundarias ---------- */
.view{position:absolute;inset:0 0 7.4rem 0;background:var(--bg);display:flex;flex-direction:column;opacity:0;transform:scale(1.015);transition:opacity .2s,transform .2s;z-index:5}
.view.in{opacity:1;transform:none}
.view.out{opacity:0;transform:scale(.99)}
.view.zoom{transform:scale(.2);transition:transform .34s cubic-bezier(.2,.9,.25,1),opacity .22s}
.view.zoom.in{transform:none}
.view.zoom.out{transform:scale(.2);opacity:0}
.vhead{display:flex;align-items:center;gap:1.4rem;margin:0 var(--pad);padding:3rem 0 1.8rem;border-bottom:1px solid var(--line);font-size:2.6rem;font-weight:500}
.vhead svg{width:3rem;height:3rem;color:var(--accent);flex:0 0 auto}
.vhead .sub{margin-left:auto;font-size:1.6rem;font-weight:600;color:var(--fg2);white-space:nowrap}
.vbody{flex:1;overflow:auto;padding:2.6rem var(--pad) 3rem;scrollbar-width:none}
.vbody::-webkit-scrollbar,.pmenu::-webkit-scrollbar,.ppane::-webkit-scrollbar{display:none}
.empty{color:var(--fg2);font-size:1.8rem;text-align:center;margin-top:8rem}

.tabs{display:flex;align-items:center;gap:.6rem;margin:1.6rem var(--pad) 0;font-size:1.5rem;font-weight:700;flex-wrap:nowrap;overflow:hidden}
.tab{padding:.65rem 1.6rem;border-radius:99rem;color:var(--fg2);white-space:nowrap;transition:background .15s,color .15s}
.tab.on{background:var(--accent);color:#06222c}
.chip{font-size:1.1rem;font-weight:900;border:.18rem solid var(--fg2);color:var(--fg2);border-radius:.5rem;padding:.2rem .5rem;margin:0 .6rem}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2.6rem 1.6rem}
.grid .tile{width:100%;height:auto;aspect-ratio:1}
.apick .grid{grid-template-columns:repeat(5,1fr)}
.apick .tile{background:var(--bg2)}
.apick .tile img,.apick .tile video{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.apick .tile.vert img,.apick .tile.vert video{object-fit:contain}
.apick .ck{position:absolute;right:.8rem;top:.8rem;width:3rem;height:3rem;border-radius:50%;background:var(--accent);color:#06222c;display:grid;place-items:center;font-weight:900;font-size:1.6rem;box-shadow:0 .2rem .6rem rgba(0,0,0,.4)}
.apick .tag{position:absolute;left:.8rem;bottom:.8rem;background:rgba(0,0,0,.72);color:#fff;font-size:1.1rem;font-weight:800;border-radius:.5rem;padding:.25rem .6rem}
.apick .more{grid-column:1/-1;color:var(--fg2);font-size:1.5rem;text-align:center;padding:1rem 0}
.cap{position:absolute;left:-.8rem;right:-.8rem;top:calc(100% + .7rem);font-size:1.35rem;font-weight:700;color:var(--accent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;--mqgap:2.4rem}
.focused .cap{opacity:1}

.lrow{--r:.9rem;display:flex;align-items:center;gap:1.6rem;width:100%;text-align:left;padding:1.3rem 1.6rem;border-radius:.9rem;background:var(--bg2);margin-bottom:1rem;position:relative;font-size:1.7rem}
.lrow .meta{display:flex;flex-direction:column;gap:.25rem;min-width:0;flex:1}
.lrow .meta b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .meta span{font-size:1.4rem;color:var(--fg2)}
.lrow .val{color:var(--accent);font-weight:700;white-space:nowrap}
.mini{width:4.6rem;height:4.6rem;border-radius:.7rem;object-fit:cover;flex:0 0 auto}
.dot{width:1.1rem;height:1.1rem;border-radius:50%;flex:0 0 auto}
.fav{width:4.6rem;height:4.6rem;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 auto}
.fav svg{width:2.4rem;height:2.4rem}
.bar{height:.8rem;border-radius:99rem;background:var(--line);overflow:hidden;width:16rem;flex:0 0 auto}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}

/* opciones del juego (X) */
.props{display:grid;grid-template-columns:30rem 1fr;gap:3.4rem;flex:1;min-height:0;padding:2.6rem var(--pad) 2.6rem}
.pmenu{overflow:auto;padding:.8rem;margin:-.8rem;scrollbar-width:none}
.ppane{background:var(--bg2);border-radius:1.2rem;padding:2.8rem 3rem;overflow:auto;min-height:0;scrollbar-width:none}
.pinfo{display:flex;gap:2.8rem;align-items:flex-start}
.pcover{width:18rem;height:18rem;border-radius:1rem;object-fit:cover;box-shadow:var(--shadow);flex:0 0 auto}
.ppane h2{font-size:2.6rem;margin-bottom:1.6rem;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.9rem 2.6rem;font-size:1.6rem}
.kv dt{color:var(--fg2)} .kv dd{font-weight:600}
.note{color:var(--fg2);font-size:1.6rem;line-height:1.55;margin-top:1.4rem}
.prog{display:flex;align-items:center;gap:1.4rem;font-size:1.6rem;font-weight:600}
.prog .bar{width:22rem}
.alist{margin-top:2rem;display:flex;flex-direction:column;gap:1rem}
.alist div{display:flex;gap:1.2rem;align-items:center;font-size:1.5rem}
.alist svg{width:2rem;height:2rem;flex:0 0 auto}
.alist img.achi{width:3.6rem;height:3.6rem;border-radius:.6rem;flex:0 0 auto;object-fit:cover}
.fav.achi{border-radius:.8rem;overflow:hidden;background:var(--line)}
.fav.achi img{border-radius:0}
.artprev{display:flex;gap:2.8rem;align-items:center}
.artprev img{width:22rem;height:22rem;border-radius:1rem;object-fit:cover;box-shadow:var(--shadow)}

/* diálogo */
.view.dialog{inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:9;transform:none}
.dbox{background:var(--bg2);border-radius:1.4rem;width:58rem;max-width:90vw;box-shadow:0 2rem 5rem rgba(0,0,0,.5);transform:scale(.94);transition:transform .2s cubic-bezier(.2,.9,.25,1)}
.view.dialog.in .dbox{transform:none}
.dbox p{padding:4.2rem 3.6rem;text-align:center;font-size:1.8rem;line-height:1.5;white-space:pre-line}
.dbtns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.dbtns button{--r:.6rem;padding:1.9rem;font-weight:700;color:var(--accent);font-size:1.75rem;position:relative}
.dbtns button+button{border-left:1px solid var(--line)}
.dbtns.three{grid-template-columns:1fr 1fr 1fr}
.dsub{display:block;font-size:1.6rem;color:var(--fg2);margin-top:1rem}
.dbtns .focused::after{inset:.3rem;border-radius:.8rem}

/* teclado en pantalla */
.kb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8rem;padding:1rem var(--pad);min-height:0}
.kbfield{width:min(80rem,100%);background:var(--bg2);border-radius:.9rem;padding:1.2rem 2rem;font-size:2.3rem;font-weight:600;min-height:5.6rem;display:flex;align-items:center;border:.2rem solid var(--line)}
.kbfield .ph{color:var(--fg2);font-weight:500}
.caret{width:.22rem;height:2.8rem;background:var(--accent);margin-left:.15rem;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kbcount{color:var(--fg2);font-size:1.5rem;font-weight:600;min-height:2rem}
.kbrows{display:flex;flex-direction:column;gap:1rem;align-items:center}
.kbrow{display:flex;gap:1rem}
.key{--r:.7rem;position:relative;width:6.8rem;height:5.6rem;border-radius:.7rem;background:var(--bg2);font-size:2.1rem;font-weight:600;box-shadow:var(--shadow)}
.key.wide{width:20rem;font-size:1.7rem}
.key.ok{background:var(--accent);color:#06222c}

/* álbum */
.agrid{display:grid;grid-template-columns:repeat(5,1fr);gap:2.8rem 1.4rem}
.shot{--r:.6rem;position:relative;aspect-ratio:16/9;border-radius:.6rem;background:var(--tile);animation:tileIn .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0) * 25ms)}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.shot .vid{position:absolute;right:.7rem;bottom:.7rem;background:rgba(0,0,0,.65);color:#fff;font-size:1.2rem;font-weight:700;padding:.3rem .8rem;border-radius:99rem}
.view.viewer{background:#000;color:#fff}
.vwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:2.4rem var(--pad);min-height:0}
.vwrap img,.vwrap video{max-width:100%;max-height:calc(100% - 4rem);border-radius:.6rem;animation:fadeIn .25s ease both}
.vcap{font-size:1.5rem;color:#cfcfd4;font-weight:600}
/* reproductor de video estilo Switch: sin controles de Chromium */
.vplayer{position:relative;flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease both}
.vwrap .vplayer video{width:100%;height:100%;max-height:none;object-fit:contain;border-radius:0;background:#000;animation:none}
.vctl{position:absolute;left:0;right:0;bottom:0;padding:5rem 3.2rem 2rem;background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;align-items:center;gap:1.8rem;transition:opacity .35s}
.vplayer.idle .vctl,.vplayer.idle .vbig{opacity:0}
.vctl .pp{width:2.6rem;height:2.6rem;flex:none;color:#fff}
.vctl .t{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;color:#fff;min-width:5.2rem}
.vctl .t.r{text-align:right}
.vbar{position:relative;flex:1;height:.6rem;border-radius:99rem;background:rgba(255,255,255,.28);cursor:pointer}
.vbar .buf{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:rgba(255,255,255,.35)}
.vbar .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent,#22d6e3)}
.vbar .knob{position:absolute;top:50%;width:1.9rem;height:1.9rem;margin:-.95rem 0 0 -.95rem;border-radius:50%;background:#fff;box-shadow:0 0 0 .35rem var(--accent,#22d6e3)}
.vbig{position:absolute;width:9rem;height:9rem;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;transition:opacity .3s;pointer-events:none}
.vbig svg{width:4rem;height:4rem}
.vplayer:not(.paused) .vbig.play{opacity:0}
.vbig.load{opacity:0;background:none}
.vplayer.wait .vbig.load{opacity:1}
.vbig.load i{width:5.6rem;height:5.6rem;border-radius:50%;border:.5rem solid rgba(255,255,255,.25);border-top-color:#fff;animation:vspin .8s linear infinite}
@keyframes vspin{to{transform:rotate(360deg)}}
.vplayer .verr{position:absolute;font-size:1.8rem;color:#ddd;text-align:center;line-height:1.5}

/* perfil */
.pcard{display:flex;align-items:center;gap:2.4rem;margin-bottom:2.6rem}
.pcard .avatar{width:11rem;height:11rem;font-size:4.6rem}
.pcard h2{font-size:3rem}
.pcard p{color:var(--fg2);font-size:1.6rem;margin-top:.4rem}
.stats{display:flex;gap:1.6rem;margin-bottom:2.6rem}
.stat{background:var(--bg2);border-radius:.9rem;padding:1.4rem 2.2rem;font-size:1.4rem;color:var(--fg2)}
.stat b{display:block;font-size:2.6rem;color:var(--fg)}

/* ---------- capas de sistema ---------- */
#toast{position:absolute;left:50%;bottom:9.6rem;transform:translate(-50%,1rem);background:var(--bg2);padding:1.1rem 2.2rem;border-radius:99rem;font-weight:700;font-size:1.5rem;box-shadow:var(--shadow);opacity:0;transition:.2s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

#notifs{position:fixed;top:2.4rem;left:2.4rem;z-index:90;display:flex;flex-direction:column;gap:1rem;pointer-events:none}
.notif{display:flex;align-items:center;gap:1.3rem;background:rgba(8,8,10,.94);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:1.1rem;padding:1rem 2rem 1rem 1rem;min-width:32rem;max-width:46rem;box-shadow:0 .8rem 2.4rem rgba(0,0,0,.55);animation:nIn .38s cubic-bezier(.2,.9,.25,1) both}
.notif.out{animation:nOut .3s ease both}
.notif .ic{width:4.8rem;height:4.8rem;border-radius:.8rem;display:grid;place-items:center;flex:0 0 auto;background:#fff;color:#111;font-weight:800;font-size:2rem;overflow:hidden}
.notif .ic svg{width:2.6rem;height:2.6rem}
.notif .ic img{width:100%;height:100%;object-fit:cover}

/* pantalla de carga con logos girando */
#launch{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .38s ease;z-index:48}
#launch.show{opacity:1;pointer-events:auto}
#launch .ll{position:absolute;right:4.6rem;bottom:4.2rem;height:5.4rem;display:flex;align-items:center;gap:1.6rem;opacity:0;transition:opacity .45s ease;perspective:60rem}

.ll img{height:100%;width:auto;display:block;backface-visibility:visible}

#lock{position:fixed;inset:0;z-index:46;display:none;color:#fff;background:#0d0d10;overflow:hidden}

#lock.out{display:block;animation:fadeOut .38s both}
.lbg{position:absolute;inset:-4rem;background:#15151a center/cover no-repeat;filter:blur(2.4rem) brightness(.32)}

.lcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.8rem}

.licon{width:16rem;height:16rem;border-radius:50%;display:grid;place-items:center;border:.35rem solid rgba(255,255,255,.9);background:rgba(255,255,255,.06)}

#sleep{position:fixed;inset:0;background:#000;z-index:70;opacity:0;pointer-events:none;transition:opacity .5s}

/* arranque animado */
#boot{position:fixed;inset:0;background:#0b0b0d;display:grid;place-items:center;z-index:95;transition:opacity .55s;cursor:pointer}
#boot.gone{opacity:0;pointer-events:none}
.mark{display:flex;flex-direction:column;align-items:center;gap:2.6rem;color:#fff}
.blogos{display:flex;align-items:center;gap:2.6rem;height:9.5rem;perspective:80rem;animation:glow 1.4s 1.45s ease-in-out both}
.blogos img{height:100%;width:auto;display:block}
.blogos .b1{animation:bL .9s .1s cubic-bezier(.2,.9,.25,1) both}
.blogos .b2{height:78%;transform-origin:50% 100%;animation:bS .5s .5s cubic-bezier(.2,.9,.25,1) both}
.blogos .b3{animation:bX 1.1s .6s cubic-bezier(.2,.9,.25,1) both}
.mark b{font-size:2.2rem;font-weight:800;letter-spacing:.6rem;animation:wIn .9s 1s cubic-bezier(.2,.9,.25,1) both}
.mark .press{font-size:1.4rem;color:#8a8a92;animation:fadeIn .6s 2s both,breathe 2.4s 2.6s ease-in-out infinite}
#boot.gone .mark{animation:bOut .5s ease both}
@keyframes bL{from{opacity:0;transform:translateX(-5rem)}to{opacity:1;transform:none}}
@keyframes bS{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes bX{from{opacity:0;transform:rotateY(-300deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}45%{filter:drop-shadow(0 0 1.4rem rgba(255,255,255,.55))}}

/* pantalla de controles estilo consola */
.ctl{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 1px 46rem;min-height:0;margin:0 var(--pad)}
.ctl-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3rem;padding:2rem 3rem 2rem 0;min-width:0}

.ctl-note{font-size:1.75rem;color:var(--fg2);font-weight:500;min-height:2.4rem;text-align:center}
.ordering .ctl-right{opacity:.35}

.tart{width:min(100rem,92%)}

@keyframes wIn{from{opacity:0;letter-spacing:1.8rem}to{opacity:1;letter-spacing:.5rem}}

.sbar{display:flex;height:1.4rem;border-radius:99rem;overflow:hidden;background:var(--line);margin:1.4rem 0 1rem}
.sbar i{display:block;height:100%}
.slegend{display:flex;gap:2.4rem;font-size:1.35rem;color:var(--fg2)}
.slegend span{display:inline-flex;align-items:center;gap:.6rem}
.slegend i{width:1rem;height:1rem;border-radius:.3rem;display:inline-block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =====================================================================
   Skin estilo Switch 2 (alpha 0.3) — medidas tomadas cuadro por cuadro del video de referencia (1080p):
   fondo #1f1f1f · portadas 384 px con esquinas de 18 px y 22 px de separación · anillo de 6 px con 5 px de aire,
   degradado azul → cian → lila → rosa que gira en el sentido del reloj (≈7.2 s por vuelta) · barra de íconos
   en "píldora" #333 · textos de selección en cian #22d6e3 · tipografía en peso normal.
   ===================================================================== */
:root{
  --bg:#1f1f1f; --bg2:#333333; --bg3:#3b3b3b; --fg:#ffffff; --fg2:#a8a8a8; --line:#404040;
  --tile:#333333; --accent:#22d6e3; --accent2:#22d6e3; --icon:transparent; --iconfg:#aeafb2;
  --shadow:none; --pad:4.6rem; --sel:#424242;
  --ringw:.37rem; --ringgap:.31rem;
  --ringstops:#b087f7 0deg,#f0aacb 30deg,#f0c0db 60deg,#e0a8d2 90deg,#4c74ec 120deg,#0274fc 150deg,#62a2f5 180deg,#b3eaef 210deg,#c0fbfb 240deg,#87a7f0 270deg,#6e5ff4 300deg,#775ffe 330deg,#b087f7 360deg;
}
:root[data-theme="light"]{
  --bg:#ebebeb; --bg2:#ffffff; --bg3:#f4f4f4; --fg:#2d2d2d; --fg2:#6e6e6e; --line:#cfcfcf;
  --tile:#d6d6d6; --accent:#0099b8; --accent2:#0099b8; --icon:transparent; --iconfg:#6e6e70; --sel:#dcdcdc;
  --shadow:none;
}
@property --ringa{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ringspin{to{--ringa:360deg}}
body{font-weight:400}

/* anillo de selección: degradado que gira, con un filo oscuro entre el anillo y lo seleccionado */
.focused::after{inset:calc(-1 * (var(--ringgap) + var(--ringw)));border:0;border-radius:calc(var(--r,1rem) + var(--ringgap) + var(--ringw));
  padding:var(--ringw);background:conic-gradient(from var(--ringa),var(--ringstops));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;animation:ringspin 4s linear infinite;box-shadow:none}
.noprop .focused::after{animation:none}
.tile.focused,.avatar.focused{box-shadow:0 0 0 var(--ringgap) rgba(4,4,6,.92)}
.avatar.focused::after,.app.focused::after,.tile.all.focused::after{border-radius:50%}
.echo{border-color:#87a7f0}

/* barra superior */
.top{padding:4.15rem var(--pad) 0}
.avatar{width:5.7rem;height:5.7rem;box-shadow:none}
.users .avatar:first-child::before{content:"1";position:absolute;top:-2.6rem;left:50%;transform:translateX(-50%);color:#4cd94c;font-size:1.5rem;font-weight:400}
.status{font-size:2.7rem;font-weight:400;gap:2rem;align-items:center;line-height:1}
.status .clock{line-height:1;font-variant-numeric:tabular-nums}
.status .wifi{height:2.2rem;width:auto;display:block}
.status .batt{display:flex;align-items:center;gap:.7rem;font-size:2.1rem;line-height:1}
.status .batt svg{height:2rem;width:auto;display:block}
.status .battPct{display:inline;font-variant-numeric:tabular-nums}

/* inicio */
.home{justify-content:flex-start;padding-top:3.2rem}
.titlebar{height:3.4rem;margin-bottom:1.3rem}
#gameTitle{font-weight:400;font-size:2.1rem;color:var(--accent);display:flex;align-items:center;gap:.8rem;text-align:left;transition:opacity .12s}
#gameTitle .gt-ic{flex:0 0 auto;width:1.7rem;height:2.1rem;display:block;color:var(--accent)}
#gameTitle .mqbox{min-width:0;overflow:hidden}
.rowwrap{padding:1rem 0}
.track{gap:1.37rem;padding:0 4.6rem 0 9.94rem}
.tile{--r:1.12rem;width:23.85rem;height:23.85rem;border-radius:1.12rem;box-shadow:none}
.tile.all{width:12rem;height:12rem;background:var(--bg2);color:var(--iconfg);margin-left:1rem}
.apps{align-self:center;margin-top:4.3rem;gap:.5rem;background:var(--bg2);height:8.45rem;border-radius:99rem;padding:0 .7rem;align-items:center}
.app{--r:50%;width:7.08rem;height:7.08rem;background:transparent;box-shadow:none;transition:background .12s}
.app svg{width:3.7rem;height:3.7rem;stroke-width:1.7}
.app.focused{background:var(--sel)}
.app.focused::after{--ringgap:.06rem}
.app .lbl{top:calc(100% + 1.8rem);font-size:2.1rem;font-weight:400;color:var(--accent);z-index:7}

/* "Jugando": como en la consola, píldora negra con tu avatar */
.playing{position:absolute;left:50%;bottom:1.9rem;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;max-width:calc(100% - 1.6rem)}
.playing .pav{width:4.9rem;height:4.9rem;border-radius:50%;overflow:hidden;flex:0 0 auto;background:linear-gradient(140deg,#ff9d4a,#ff4f86);display:grid;place-items:center;color:#fff;font-size:2rem;box-shadow:0 0 0 .15rem rgba(255,255,255,.9)}
.playing .pav img,.playing .pav video{width:100%;height:100%;object-fit:cover;border-radius:50%}
.playing b{height:4.9rem;min-width:14.5rem;display:flex;align-items:center;justify-content:center;padding:0 2.4rem;background:#000;color:#fff;border:.2rem solid #fff;border-radius:99rem;font-weight:400;font-size:2.1rem;white-space:nowrap}

/* pie: sin línea en el inicio, con línea en los menús */
.hints{border-top-color:transparent;font-size:2rem;font-weight:400;height:7.4rem;background:transparent}
#app:has(.view.in:not(.dialog)) .hints{background:var(--bg)}
#app:has(.view.in:not(.dialog)) .hints{border-top-color:var(--line)}
.hints .left{gap:.5rem;color:var(--fg);flex-direction:column;align-items:flex-start}
#padName{display:none}
.padsq{display:flex;gap:.35rem;margin-left:.2rem}
.padsq i{width:.6rem;height:.6rem;background:#6d6d6d;display:block}
.padsq i.on{background:#4cd94c}
.padicon{height:3.6rem}
.hint{margin-left:2.6rem;gap:.8rem}
.glyph{min-width:2.15rem;height:2.15rem;font-size:1.3rem;font-weight:700}

/* menús: encabezado ligero, filas planas con separadores, la seleccionada con relleno + anillo */
.view{inset:0 0 7.4rem 0}
.vhead{font-size:2.6rem;font-weight:400;padding:3.3rem 0 1.9rem}
.vhead svg{color:var(--fg)}
.vhead .sub{font-weight:400}
.lrow{--r:.6rem;background:transparent;border-radius:.6rem;margin-bottom:0;border-bottom:1px solid var(--line);font-size:2rem;padding:1.6rem 1.8rem}
.lrow .meta b{font-weight:400}
.lrow .meta span{font-size:1.5rem}
.lrow .val{font-weight:400}
.lrow.focused{background:var(--bg3);border-bottom-color:transparent}
.lrow.focused::after{--ringgap:0rem}
.pmenu .lrow{border-bottom:0}
.pmenu .lrow.focused .meta b{color:var(--accent)}
.pmenu .lrow.focused::before{content:"";position:absolute;left:1.9rem;top:22%;bottom:22%;width:.3rem;border-radius:99rem;background:var(--accent)}
.pmenu .lrow.focused .meta{padding-left:1.4rem}
.ppane{background:transparent;border-left:1px solid var(--line);border-radius:0;padding:1rem 0 1rem 4rem}
.ppane h2{font-weight:400}

/* diálogo: caja #333, texto normal, botones en cian; el elegido con relleno y anillo */
.view.dialog{background:rgba(0,0,0,.62)}
.dbox{background:var(--bg2);border-radius:1rem;width:66.6rem;box-shadow:none}
.dbox p{font-size:2.1rem;line-height:1.45;text-align:left;padding:5.4rem 8.9rem 4.2rem}
.dbtns button{--r:.5rem;font-weight:400;font-size:2.1rem;padding:2.5rem}
.dbtns .focused{background:var(--bg3)}
.dbtns .focused::after{inset:calc(-1 * var(--ringw));border-radius:.6rem;--ringgap:0rem}

/* teclas, menú rápido y demás tarjetas: misma familia de colores y pesos */
.key{box-shadow:none;font-weight:400}
.key.ok{background:var(--accent);color:#06222c}
.kbfield{border-color:var(--line);font-weight:400}
.qrow{font-weight:400;background:var(--bg3)}
.qrows{overflow:visible;padding:.7rem;margin:-.7rem}
.qrow.focused::after{--ringgap:0rem}
.qhint,.qhint .hint{font-weight:400}
.qhead .qb,.qhead .qb .batt{font-weight:400}
.qhead{font-weight:400}
.qseg span.on{background:var(--accent);color:#06222c}
#toast{font-weight:400;background:var(--bg3)}
.tab{font-weight:400}
.cap{font-weight:400}
</style>
</head>

<script>
"use strict";
/* Modo "overlay": la misma interfaz, pero solo el menú rápido, en una ventanita encima del juego (la abre la app). */
const OVERLAY = new URLSearchParams(location.search).get("overlay") === "quick";
if (OVERLAY) document.documentElement.classList.add("overlay");
/* el contorno gira con CSS; en navegadores sin @property se gira desde aquí (mismo ritmo: una vuelta cada 4 s) */
if (!(window.CSS && CSS.registerProperty)) {
  document.documentElement.classList.add("noprop");
  (function spin(t) {
    const a = (t / 4000 * 360) % 360 + "deg";
    document.querySelectorAll(".focused").forEach(e => e.style.setProperty("--ringa", a));
    requestAnimationFrame(spin);
  })(0);
}
const PADSRC = document.getElementById("padsrc").src, XPADSRC = document.getElementById("xpadsrc").src, PSPADSRC = document.getElementById("pspadsrc").src;
document.documentElement.style.setProperty("--padimg", `url("${PADSRC}")`);
document.querySelectorAll("#launch [data-src]").forEach(i => i.src = document.querySelector("#boot ." + i.dataset.src).src);
/* ================= utilidades ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const xml = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const trunc = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
const wait = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = {
  get(k, d) { try { const v = localStorage.getItem("scarlet." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("scarlet." + k, JSON.stringify(v)); } catch {} }
};
const settings = Object.assign({ theme: "dark", sound: true, rumble: true, sgdbKey: "" }, store.get("settings", {}));
const saveSettings = () => store.set("settings", settings);
const applyTheme = () => { document.documentElement.dataset.theme = settings.theme; };
applyTheme();

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2300); }

/* ================= sonidos: clics percusivos sintetizados ================= */
const Snd = {
  ctx: null, noise: null, bus: null,
  ensure() {
    if (!this.ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      const c = this.ctx = new C();
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
      this.bus = c.createGain(); this.bus.gain.value = .9; this.bus.connect(comp).connect(c.destination);
      const n = c.sampleRate * .6, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  env(g, at, v, dur, atk = .0015) {
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at + atk); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  },
  // ruido filtrado muy corto: el "tac" de plástico/madera
  click(t, freq, q, dur, v) {
    const c = this.ensure(); if (!c) return; const at = c.currentTime + t;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    this.env(g, at, v, dur); s.connect(f).connect(g).connect(this.bus); s.start(at, Math.random() * .4); s.stop(at + dur + .02);
  },
  // tono con caída de afinación: da el "cuerpo" del clic
  tone(t, f0, f1, dur, v, type = "sine") {
    const c = this.ensure(); if (!c) return; const at = c.currentTime + t;
    const o = c.createOscillator(), g = c.createGain(); o.type = type;
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + dur * .7);
    this.env(g, at, v, dur, .002); o.connect(g).connect(this.bus); o.start(at); o.stop(at + dur + .02);
  },
  // nota tipo marimba (fundamental + armónicos que se apagan rápido)
  pluck(t, f, dur, v) {
    [[1, 1], [3.98, .22], [9.1, .06]].forEach(([m, a], i) => {
      const c = this.ensure(); if (!c) return; const at = c.currentTime + t;
      const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f * m;
      this.env(g, at, v * a, dur / (1 + i * 1.8), .003); o.connect(g).connect(this.bus); o.start(at); o.stop(at + dur + .02);
    });
  },
  /* sonidos propios: archivos en la carpeta "sounds" junto a la app (move.wav, select.wav…) reemplazan a los sintetizados */
  custom: {},
  async loadCustom(map) {
    const c = this.ensure(); if (!c || !map) return;
    for (const [name, url] of Object.entries(map)) {
      try { const r = await fetch(url); this.custom[name] = await c.decodeAudioData(await r.arrayBuffer()); }
      catch (e) { console.warn("sonido", name, e); }
    }
  },
  sample(name, rate = 1) {
    const c = this.ensure(), b = this.custom[name]; if (!c || !b) return false;
    const s = c.createBufferSource(); s.buffer = b; s.playbackRate.value = rate; s.connect(this.bus); s.start();
    return true;
  },
  whoosh(t, f0, f1, dur, v) {
    const c = this.ensure(); if (!c) return; const at = c.currentTime + t;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = "bandpass"; f.Q.value = 1.4;
    f.frequency.setValueAtTime(f0, at); f.frequency.exponentialRampToValueAtTime(f1, at + dur);
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    s.connect(f).connect(g).connect(this.bus); s.start(at); s.stop(at + dur + .02);
  }
};
function play(n, x = 0) {
  rumble(n);
  if (!settings.sound) return;
  if (Snd.custom[n] && Snd.sample(n, n === "tick" ? .85 + x * .15 : 1)) return;

const Events = {
  h: {},
  on(n, f) { (this.h[n] = this.h[n] || []).push(f); return () => { this.h[n] = this.h[n].filter(x => x !== f); }; },
  emit(n, d) { (this.h[n] || []).slice().forEach(f => f(d)); }
};
const Host = {
  has: !!(window.chrome && window.chrome.webview), seq: 0, pending: new Map(),
  init() {
    if (!this.has) return;
    window.chrome.webview.addEventListener("message", e => {
      const m = e.data; if (!m) return;
      if (m.event) return Events.emit(m.event, m.data);
      const p = this.pending.get(m.id); if (!p) return;
      this.pending.delete(m.id); m.ok ? p.res(m.data) : p.rej(new Error(m.error || "host"));
    });
  },
  call(type, payload = {}) {
    if (!this.has) return Promise.reject(new Error("sin anfitrión"));
    const id = ++this.seq;
    return new Promise((res, rej) => {
      this.pending.set(id, { res, rej });
      window.chrome.webview.postMessage({ id, type, payload });
      setTimeout(() => { if (this.pending.delete(id)) rej(new Error("timeout")); }, 45000);
    });
  }
};

function tileExtras(g) {

}
function buildTile(g, cls = "tile") {

}
/* imagen real del logro (Steam); si no hay o no carga, el trofeo / candado de siempre */
function achImg(x, cls = "") {

}
function avatarFrame() { return profile.frameUrl ? `<img class="aframe" alt="" src="${esc(profile.frameUrl)}">` : ""; }
function avatarHTML() {
  const u = profile.avatarUrl; if (!u) return esc((profile.name || "?")[0].toUpperCase());

}

}
const homeTiles = () => [...$("#track").children];
function homeEl() {
  if (home.zone === "games") return homeTiles()[home.g];

}
const focusedGame = () => home.zone === "games" && home.g < homeGames().length ? homeGames()[home.g] : null;
const primaryLabel = g => g.appid === state.running ? "Reanudar" : !g.installed && !state.downloads[g.appid] ? "Instalar" : g.kind === "app" ? "Abrir" : "Iniciar";

/* texto que se desplaza (como en la consola) si no cabe en su espacio */
function marquee(box, text, active) {
  box.dataset.t = text; box.classList.add("mqbox"); box.classList.remove("scroll");
  box.textContent = text;
  if (!active || box.scrollWidth <= box.clientWidth + 1) return;
  box.innerHTML = `<span class="mq"><span>${esc(text)}</span><span aria-hidden="true">${esc(text)}</span></span>`;
  const first = box.firstChild.firstChild, gap = parseFloat(getComputedStyle(box.firstChild).columnGap) || 0;
  const dist = first.offsetWidth + gap;
  box.style.setProperty("--mqd", -dist + "px");
  box.style.setProperty("--mqdur", (dist / (rem() * 5.5) / .84).toFixed(2) + "s");
  box.classList.add("scroll");
}
function setHints(list) {
  $("#hints").innerHTML = list.map(([k, t]) => `<span class="hint"><span class="glyph">${esc(k)}</span>${esc(t)}</span>`).join("");
}
function updateFocus() {
  $$(".focused").forEach(e => { e.classList.remove("focused"); const c = e.querySelector(".cap"); if (c) marquee(c, c.dataset.t || c.textContent, false); });
  const v = topView();
  if (v) {
    const items = v.items();
    if (items.length) {
      v.i = clamp(v.i, 0, items.length - 1);
      const el = items[v.i]; el.classList.add("focused");
      el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" });
      const cap = el.querySelector(".cap"); if (cap) marquee(cap, cap.dataset.t || cap.textContent, true);
      if (v.onFocus) v.onFocus(v.i);
    }
    setHints(typeof v.hints === "function" ? v.hints() : (v.hints || [["B", "Atrás"], ["A", "Aceptar"]]));
    return;
  }
  const el = homeEl(); if (!el) return;
  el.classList.add("focused");
  const title = $("#gameTitle");
  if (home.zone === "games") {
    const wrapW = $("#rowwrap").clientWidth, m = rem() * 4.6;
    let x = home.offset;
    const left = el.offsetLeft, right = left + el.offsetWidth;
    if (left - x < m) x = left - m;
    if (right - x > wrapW - m) x = right - wrapW + m;
    home.offset = Math.max(0, x);
    $("#track").style.transform = `translateX(${-home.offset}px)`;
    const g = focusedGame(), name = g ? g.name : "Biblioteca", txt = $("#gtText");
    // el nombre centrado arriba de su portada; si no cabe en pantalla, se desplaza
    title.style.width = "auto"; marquee(txt, name, false);
    const natural = title.scrollWidth, edge = rem() * 4.6, maxW = wrapW - 2 * edge;
    const w = Math.min(natural, maxW), center = left - home.offset + el.offsetWidth / 2;
    const tx = clamp(center - w / 2, edge, wrapW - edge - w);
    title.style.width = w + "px"; if (natural > maxW) marquee(txt, name, true);
    title.style.transform = `translateX(${tx}px)`; title.style.opacity = 1;
    setHints(!g ? [["A", "Abrir"]] : g.appid === state.running ? [["☰", "Opciones"], ["X", "Cerrar"], ["A", "Reanudar"]] : [["X", "Opciones"], ["A", primaryLabel(g)]]);
  } else {
    title.style.opacity = 0;
    setHints(home.zone === "apps" ? [["A", "Abrir"]] : [["A", "Ver perfil"]]);
  }
}

/* ================= navegación ================= */
function wiggle(el, dir) {
  if (!el || !el.animate) return;
  const a = .7 * (dir === "left" || dir === "up" ? -1 : 1), ax = dir === "up" || dir === "down" ? "y" : "x";
  const t = v => ax === "x" ? `${v}rem 0` : `0 ${v}rem`;
  el.animate([{ translate: t(0) }, { translate: t(a) }, { translate: t(-a * .55) }, { translate: t(a * .25) }, { translate: t(0) }], { duration: 300, easing: "ease-out" });
}
function bump(el, dir) { play("bump"); wiggle(el, dir || "right"); }
function navHome(dir) {
  const before = homeEl();
  if (home.zone === "games") {
    const n = homeTiles().length;
    if (dir === "left" && home.g > 0) home.g--;
    else if (dir === "right" && home.g < n - 1) home.g++;
    else if (dir === "up") home.zone = "top";
    else if (dir === "down") home.zone = "apps";
  } else if (home.zone === "apps") {
    if (dir === "left" && home.a > 0) home.a--;
    else if (dir === "right" && home.a < APPS.length - 1) home.a++;
    else if (dir === "up") home.zone = "games";
  } else {
    const n = $("#users").children.length;
    if (dir === "left" && home.t > 0) home.t--;
    else if (dir === "right" && home.t < n - 1) home.t++;
    else if (dir === "down") home.zone = "games";
  }
  if (homeEl() === before) return bump(before, dir);
  play("move"); updateFocus();
}
function homeJump(k) {
  if (home.zone !== "games") return bump(homeEl(), k === "lb" ? "left" : "right");
  const n = homeTiles().length, g = clamp(home.g + (k === "lb" ? -5 : 5), 0, n - 1);
  if (g === home.g) return bump(homeEl(), k === "lb" ? "left" : "right");
  home.g = g; play("move"); updateFocus();
}
function navView(v, dir) {
  if (v.nav && v.nav(dir) !== false) return;
  const items = v.items(), cols = v.cols || 1, n = items.length;
  if (v.onLR && cols === 1 && (dir === "left" || dir === "right")) return v.onLR(v.i, dir);
  if (!n) return play("bump");
  let i = v.i;
  if (dir === "up") i -= cols;
  else if (dir === "down") i += cols;
  else if (dir === "left") { if (cols > 1 && i % cols > 0) i--; }
  else if (dir === "right") { if (cols > 1 && i % cols < cols - 1 && i + 1 < n) i++; }
  if (dir === "down" && i >= n && Math.floor((n - 1) / cols) > Math.floor(v.i / cols)) i = n - 1;
  if (i === v.i || i < 0 || i >= n) return bump(items[v.i], dir);
  v.i = i; play("move"); updateFocus();
}
function activate() {
  const v = topView();
  if (v) { const el = v.items()[v.i]; if (el) el.click(); else play("bump"); return; }
  homeEl()?.click();
}
function back() {
  const v = topView();
  if (!v) return bump(homeEl(), "left");
  if (v.onB && v.onB()) return;
  closeView(); if (v.onBack) v.onBack();
}
function optionsKey() {
  const v = topView();
  if (v) return v.onX ? v.onX() : bump(v.items()[v.i]);
  const g = focusedGame();
  if (!g) return bump(homeEl());
  g.appid === state.running ? askCloseRunning() : openView(propsView(g));
}
function askCloseRunning() {
  const g = runningGame(); if (!g) return;
  confirmDialog(`¿Cerrar ${g.name}?\nSe perderá el progreso que no hayas guardado.`, "Cerrar").then(ok => { if (ok) closeRunning(); });
}
function onHomeClick(e) {
  const el = e.target.closest("[data-z]"); if (!el || views.length || mode !== "ui") return;
  const z = el.dataset.z, i = +el.dataset.i;
  if (z === "g") {
    home.zone = "games"; home.g = i; updateFocus();
    if (i < homeGames().length) launchGame(homeGames()[i], el); else openView(libraryView(), el);
  } else if (z === "a") { home.zone = "apps"; home.a = i; updateFocus(); APPS[i].act(el); }
  else if (z === "t") { home.zone = "top"; home.t = i; updateFocus(); openView(profileView(), el); }
}

/* ================= pantallas ================= */
function openView(v, origin) {
  v.i = v.i || 0;
  const el = document.createElement("section"); v.el = el;
  el.className = "view" + (v.cls ? " " + v.cls : "") + (origin && !v.cls ? " zoom" : "");
  if (origin && !v.cls) {
    const r = origin.getBoundingClientRect(), app = $("#app").getBoundingClientRect();
    el.style.transformOrigin = `${r.left + r.width / 2 - app.left}px ${r.top + r.height / 2 - app.top}px`;
  }
  el.addEventListener("click", e => {
    const it = e.target.closest(".fi"); if (!it) return;
    const idx = v.items().indexOf(it); if (idx >= 0 && idx !== v.i) { v.i = idx; if (v.syncFromIndex) v.syncFromIndex(); updateFocus(); }
  }, true);
  v.render(el);
  $("#app").append(el);
  views.push(v);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  play(v.cls === "dialog" ? "popup" : "select"); updateFocus();
}
function closeView() {
  const v = views.pop(); v.el.classList.remove("in"); v.el.classList.add("out");
  setTimeout(() => v.el.remove(), 340);
  play("back"); updateFocus();
}
function closeAllViews() { while (views.length) views.pop().el.remove(); updateFocus(); }
const head = (icon, title, sub = "") => `<div class="vhead">${icon}<span>${esc(title)}</span><span class="sub">${esc(sub)}</span></div>`;
const fis = el => [...el.querySelectorAll(".fi")];

/* botón de apagado: hibernar o apagar el equipo (como el aviso de la consola, con su caja y botones) */
function powerMenu() {
  if (mode !== "ui" || (topView() && topView().isPower)) return;
  const opts = [["Cancelar", null], ["Hibernar", "hibernate"], ["Apagar", "shutdown"]];
  openView({
    cls: "dialog", cols: 3, isPower: true, i: 1, hints: [["B", "Cancelar"], ["A", "Aceptar"]],
    render(el) {
      el.innerHTML = `<div class="dbox"><p>¿Qué quieres hacer?\n<span class="dsub">Hibernar guarda todo lo que tienes abierto y apaga la pantalla; al prender, sigues donde te quedaste.</span></p><div class="dbtns three">${opts.map(([l], i) => `<button class="fi" data-i="${i}">${l}</button>`).join("")}</div></div>`;
      fis(el).forEach(b => b.onclick = () => {
        const a = opts[+b.dataset.i][1]; closeView();
        if (!a) return;
        if (a === "hibernate") return setTimeout(() => sleepConsole("hibernate"), 300);
        if (Host.has) Host.call("system.shutdown").catch(() => {}); else toast("Prototipo: aquí se apagaría el equipo");
      });
    },
    items() { return fis(this.el); }
  });
}
function confirmDialog(text, okLabel) {
  return new Promise(res => {
    openView({
      cls: "dialog", cols: 2, hints: [["B", "Cancelar"], ["A", "Aceptar"]],
      render(el) {
        el.innerHTML = `<div class="dbox"><p>${esc(text)}</p><div class="dbtns"><button class="fi" data-r="0">Cancelar</button><button class="fi" data-r="1">${esc(okLabel)}</button></div></div>`;
        fis(el).forEach(b => b.onclick = () => { closeView(); res(b.dataset.r === "1"); });
      },
      onBack() { res(false); },
      items() { return fis(this.el); }
    });
  });
}
function pickerView(title, icon, options, current, onPick) {
  return {
    i: Math.max(0, options.findIndex(o => o.value === current)), hints: [["B", "Atrás"], ["A", "Elegir"]],
    render(el) {
      el.innerHTML = head(icon, title) + `<div class="vbody">${options.map((o, i) => `<button class="lrow fi" data-i="${i}"><span class="meta"><b>${esc(o.label)}</b></span><span class="val">${o.value === current ? "✓" : esc(o.extra || "")}</span></button>`).join("")}</div>`;
      fis(el).forEach(b => b.onclick = () => { closeView(); onPick(options[+b.dataset.i].value); });
    },
    items() { return fis(this.el); }
  };
}

/* --- opciones del juego (X) --- */
function propsView(g) {
  const sections = () => {
    const s = [{ k: "info", label: "Información" }];
    if (hasAch(g)) s.push({ k: "ach", label: "Logros" });
    s.push({ k: "art", label: "Portada" });
    if (!g.installed && g.source === "steam") s.push({ k: "install", label: "Instalar" });
    if (g.source === "steam" && g.kind !== "app") s.push({ k: "controls", label: "Controles (Steam Input)" });
    if (g.source === "steam" || (g.source === "xbox" && g.storeId)) s.push({ k: "store", label: "Ver en la tienda" });
    s.push({ k: "groups", label: "Grupos" });
    s.push({ k: "hide", label: isHidden(g) ? "Mostrar en el Inicio" : "Ocultar" });
    if (Host.has && g.kind !== "app") s.push({ k: "pause", label: "Pausar al ir al Inicio" });
    if (state.running === g.appid) s.push({ k: "close", label: g.kind === "app" ? "Cerrar aplicación" : "Cerrar juego" });
    return s;
  };
  return {
    hints() { const k = this.s && this.s[this.i] && this.s[this.i].k; const a = { ach: "Ver todos", art: "Elegir portada", store: "Abrir", close: "Cerrar", install: "Instalar", controls: "Configurar", groups: "Elegir", hide: isHidden(g) ? "Mostrar" : "Ocultar", pause: g.pause ? "Desactivar" : "Activar" }[k]; return [["B", "Atrás"], ...(a ? [["A", a]] : [])]; },
    render(el) {
      this.s = sections();
      el.innerHTML = head(I.gear, g.name, "Opciones") + `<div class="props"><div class="pmenu">${this.s.map((s, i) => `<button class="lrow fi" data-i="${i}"><span class="meta"><b>${esc(s.label)}</b></span></button>`).join("")}</div><div class="ppane"></div></div>`;
      fis(el).forEach(b => b.onclick = () => this.act(this.s[+b.dataset.i].k));
    },
    onFocus(i) { const k = this.s[i].k; if (k !== this.cur) { this.cur = k; this.pane(k); } },
    pane(k) {
      const p = $(".ppane", this.el), running = state.running === g.appid, d = state.downloads[g.appid];
      if (k === "info") {
        p.innerHTML = `<div class="pinfo"><img class="pcover" alt=""><div><h2>${esc(g.name)}</h2><dl class="kv">
          <dt>Origen</dt><dd>${esc(SOURCES[g.source] || "Steam")}</dd>
          <dt>Estado</dt><dd>${running ? "En ejecución" : d ? `${esc(d.kind)} ${Math.round(d.p * 100)} %` : g.installed ? "Instalado" : "No instalado"}</dd>
          <dt>Tiempo de uso</dt><dd>${(+g.hours || 0).toFixed(1)} h</dd>
          <dt>Última vez</dt><dd>${esc(g.last || "—")}</dd>
          ${hasAch(g) ? `<dt>Logros</dt><dd>${g.ach[0]} de ${g.ach[1]}</dd>` : ""}
          ${g.source === "steam" ? `<dt>ID de Steam</dt><dd>${g.appid}</dd>` : ""}</dl></div></div>`;
        Art.apply($(".pcover", p), g);
      } else if (k === "ach") {
        p.innerHTML = `<h2>Logros</h2><div class="prog"><div class="bar"><i style="width:0"></i></div><span>Cargando…</span></div><div class="alist"></div>`;
        Data.achievements(g).then(a => {
          if (this.cur !== "ach") return;
          $(".prog i", p).style.width = (a.total ? 100 * a.unlocked / a.total : 0) + "%";
          $(".prog span", p).textContent = `${a.unlocked} de ${a.total}`;
          $(".alist", p).innerHTML = a.list.slice(0, 7).map(x => `<div style="${x.unlocked ? "" : "opacity:.5"}">${achImg(x, "achi")}<span><b>${esc(x.name)}</b> · ${esc(x.desc)}</span></div>`).join("");
        });
      } else if (k === "art") {
        p.innerHTML = `<h2>Portada</h2><div class="artprev"><img alt=""><p class="note">Presiona A para ver todas las portadas disponibles en SteamGridDB y elegir la que más te guste. ${settings.sgdbKey || Host.has ? "" : "Sin API key solo se alternan los colores de la portada de respaldo."}</p></div>`;
        Art.apply($("img", p), g);
      } else if (k === "install") {
        p.innerHTML = `<h2>Instalar</h2><p class="note">Steam descargará el juego. Verás el progreso sobre su ícono en el menú.</p>`;
      } else if (k === "controls") {
        p.innerHTML = `<h2>Controles (Steam Input)</h2><p class="note">Abre la configuración de controles de Steam para este juego: remapear botones, sensibilidad de sticks, giroscopio y plantillas de la comunidad. Solo aplica mientras juegas con Steam; el esquema general de la consola se cambia en Armoury Crate.</p>`;
      } else if (k === "store") {
        p.innerHTML = `<h2>Ver en la tienda</h2><p class="note">${g.source === "xbox" ? "Abre la página del juego en la Microsoft Store (Xbox): actualizaciones, DLC y reseñas." : "Abre la página del juego en Steam: actualizaciones, DLC y reseñas."}</p>`;
      } else if (k === "groups") {
        const mine = groupNames().filter(n => inGroup(g, n));
        p.innerHTML = `<h2>Grupos</h2><p class="note">Ordena tu biblioteca en grupos propios (por ejemplo "Terminados" o "Por jugar"). Aparecen como pestañas en la Biblioteca.</p><p class="note">${mine.length ? "Está en: " + esc(mine.join(", ")) : "No está en ningún grupo."}</p>`;
      } else if (k === "hide") {
        p.innerHTML = isHidden(g) ? `<h2>Mostrar en el Inicio</h2><p class="note">Ahora está oculto: solo aparece en la pestaña "Ocultos" de la Biblioteca.</p>` : `<h2>Ocultar</h2><p class="note">Deja de aparecer en el Inicio y en la Biblioteca. Lo encuentras en la pestaña "Ocultos" para volver a mostrarlo.</p>`;
      } else if (k === "pause") {
        p.innerHTML = `<h2>Pausar al ir al Inicio</h2><p class="note">${g.pause ? "<b>Activado.</b> " : ""}Al regresar al Inicio con el botón Xbox, el juego se congela (no gasta batería) y sigue justo donde estaba al volver. No lo actives en juegos en línea: congelarlos puede desconectarte.</p>`;
      } else if (k === "close") {
        p.innerHTML = `<h2>${g.kind === "app" ? "Cerrar aplicación" : "Cerrar juego"}</h2><p class="note">Está abierto en segundo plano. Al cerrarlo se perderá el progreso que no hayas guardado.</p>`;
      }
    },
    act(k) {
      if (k === "ach") openView(achView(g));
      else if (k === "art") {
        if (!Host.has && !settings.sgdbKey) { Art.next(g); this.pane("art"); renderHome(); play("select"); }
        else openView(artPickerView(g, () => { if (this.cur === "art") this.pane("art"); }));
      }
      else if (k === "install") { closeView(); startInstall(g); }
      else if (k === "groups") openView(groupsView(g, () => this.pane("groups")));
      else if (k === "hide") {
        const h = new Set(settings.hidden || []);
        if (h.has(g.appid)) h.delete(g.appid); else h.add(g.appid);
        settings.hidden = [...h]; saveSettings(); play("select");
        toast(isHidden(g) ? `${g.name} se ocultó` : `${g.name} vuelve al Inicio`);
        renderHome(); const lv = views.find(v => v.cols === 6 && v.refresh); if (lv) lv.refresh(true);
        this.render(this.el); updateFocus();
      }
      else if (k === "pause") {
        g.pause = !g.pause; play("select");
        Host.call("game.pausepref", { appid: g.appid, on: g.pause }).catch(() => {});
        toast(g.pause ? "Se pausará al ir al Inicio" : "Ya no se pausará");
        this.pane("pause"); updateFocus();
      }
      else if (k === "store" && g.source === "xbox") { closeView(); Host.call("system.open", { uri: "ms-windows-store://pdp/?ProductId=" + g.storeId }).catch(() => {}); }
      else if (k === "store") { closeView(); openSystemApp({ ...SYS.store, name: g.name + " · Tienda", url: "steam://store/" + g.appid }); }
      else if (k === "controls") { closeView(); openSystemApp({ ...SYS.store, name: "Controles · " + g.name, sub: "Configuración de Steam Input en Big Picture", url: "steam://controllerconfig/" + g.appid }); }
      else if (k === "close") confirmDialog(`¿Cerrar ${g.name}?\nSe perderá el progreso que no hayas guardado.`, "Cerrar").then(ok => { if (ok) { closeRunning(); closeView(); } });
      else bump(this.items()[this.i]);
    },
    onX() { closeView(); return true; },
    items() { return fis(this.el); }
  };
}

/* --- grupos de un juego: marcar / desmarcar y crear nuevos --- */
function groupsView(g, onChange) {
  return {
    hints: [["B", "Atrás"], ["A", "Marcar"]],
    render(el) {
      const names = groupNames();
      el.innerHTML = head(I.all, "Grupos", g.name) + `<div class="vbody">${names.map((n, i) => `<button class="lrow fi" data-i="${i}"><span class="meta"><b>${esc(n)}</b><span>${(settings.groups[n] || []).length} en el grupo</span></span><span class="val">${inGroup(g, n) ? "✓" : ""}</span></button>`).join("")}<button class="lrow fi" data-new="1"><span class="meta"><b>Nuevo grupo…</b><span>Crea un grupo y agrega ${esc(g.name)}</span></span><span class="val">＋</span></button></div>`;
      fis(el).forEach(b => b.onclick = () => {
        if (b.dataset.new) return openView(keyboardView("", name => {
          name = name.trim(); if (!name) return;
          settings.groups = settings.groups || {}; settings.groups[name] = [...new Set([...(settings.groups[name] || []), g.appid])];
          saveSettings(); toast(`${g.name} se agregó a ${name}`); this.render(this.el); updateFocus(); onChange && onChange();
        }, null, { title: "Nombre del grupo", max: 24 }));
        const n = groupNames()[+b.dataset.i], list = new Set(settings.groups[n] || []);
        if (list.has(g.appid)) list.delete(g.appid); else list.add(g.appid);
        if (list.size) settings.groups[n] = [...list]; else delete settings.groups[n];
        saveSettings(); play("select"); toast(inGroup(g, n) ? `Se agregó a ${n}` : `Se quitó de ${n}`);
        this.render(this.el); updateFocus(); onChange && onChange();
      });
    },
    items() { return fis(this.el); }
  };
}

/* --- elegir portada entre todas las de SteamGridDB --- */
const ART_MODES = [["square", "Cuadradas"], ["icons", "Íconos"], ["all", "Todas"]];
function artPickerView(g, onChosen) {
  const steam = (g.source || "steam") === "steam" && g.kind !== "app";
  const media = (u, cls = "") => /\.(webm|mp4)(\?|$)/i.test(u) ? `<video class="${cls}" src="${esc(u)}" autoplay loop muted playsinline></video>` : `<img class="${cls}" alt="" loading="lazy" src="${esc(u)}">`;
  return {
    cls: "apick", mode: 0, page: 0, list: [], done: false, loading: false, err: "",
    hints() { return [["B", "Atrás"], ["Y", ART_MODES[(this.mode + 1) % ART_MODES.length][1]], ["A", "Usar esta"]]; },
    render(el) {
      el.innerHTML = head(I.album, "Elegir portada", g.name) + `<div class="tabs"><span class="chip">Y</span>${ART_MODES.map(([, l], i) => `<span class="tab${i === this.mode ? " on" : ""}">${l}</span>`).join("")}</div><div class="vbody"><div class="grid"></div></div>`;
      this.reload();
    },
    reload() {
      this.page = 0; this.list = []; this.done = false; this.err = ""; this.i = 0; this.loading = false; this.gen = (this.gen || 0) + 1;
      $$(".tab", this.el).forEach((t, i) => t.classList.toggle("on", i === this.mode));
      this.draw(); this.more();
    },
    fixed() {
      const f = [];
      if (steam) f.push({ url: "steam", thumb: Art.steamUrl(g), label: "Oficial de Steam", vert: true });
      if (g.source === "xbox" && g.art) f.push({ url: "xbox", thumb: g.art, label: "Oficial de Xbox Store" });
      f.push({ url: "none", thumb: Art.placeholder(g), label: "Colores (sin imagen)" });
      return f;
    },
    tile(o, i, cur) {
      return `<button class="tile fi${o.vert || (o.w && o.h && o.h > o.w * 1.15) ? " vert" : ""}" data-i="${i}" style="--k:${i % 10}">${media(o.thumb)}${o.url === cur ? `<span class="ck">✓</span>` : ""}${o.anim ? `<span class="tag">Animada</span>` : o.label ? "" : o.w ? `<span class="tag">${o.w}×${o.h}</span>` : ""}<span class="cap">${esc(o.label || (o.author ? "por " + o.author : "SteamGridDB"))}</span></button>`;
    },
    status() {
      return this.loading ? "Buscando portadas…" : this.err ? this.err : this.done ? (this.list.length ? `${this.list.length} ${this.list.length === 1 ? "imagen" : "imágenes"} de SteamGridDB` : "SteamGridDB no tiene portadas de este tipo para este juego. Prueba con Y.") : "";
    },
    /* dibuja todo (o solo agrega las nuevas, para que no parpadeen las que ya están) */
    draw(append) {
      const grid = $(".grid", this.el), cur = Art.pick[g.appid] || "";
      const all = [...this.fixed(), ...this.list], from = append ? (this.all || []).length : 0;
      this.all = all;
      if (!append) grid.innerHTML = `<p class="more"></p>`;
      const more = $(".more", grid);
      more.insertAdjacentHTML("beforebegin", all.slice(from).map((o, k) => this.tile(o, from + k, cur)).join(""));
      more.textContent = this.status();
      fis(grid).slice(from).forEach(b => b.onclick = () => this.choose(this.all[+b.dataset.i]));
      // el arte oficial de Steam lo resuelve la app (los juegos nuevos ya no usan la dirección clásica)
      if (!append && Host.has && steam) Host.call("cache.image", { url: Art.steamUrl(g) }).then(u => { const im = $(".tile img", grid); if (u && im) im.src = u; }).catch(() => {});
      if (topView() === this) updateFocus();
    },
    async more() {
      if (this.loading || this.done) return;
      this.loading = true; $(".more", this.el).textContent = this.status();
      const gen = this.gen;
      try {
        const items = await Art.options(g, ART_MODES[this.mode][0], this.page);
        if (gen !== this.gen) return;
        const seen = new Set(this.list.map(x => x.url));
        const fresh = items.filter(x => x.url && !seen.has(x.url));
        this.list.push(...fresh); this.page++;
        if (!fresh.length) this.done = true;
      } catch (e) {
        if (gen !== this.gen) return;
        this.done = true;
        this.err = /key/i.test(String(e && e.message)) ? "Falta la API key de SteamGridDB (Ajustes › Cuentas y arranque)." : "No se pudo consultar SteamGridDB. Revisa tu conexión.";
      }
      this.loading = false;
      if (views.includes(this)) this.draw(true);
    },
    onFocus(i) { if (i >= (this.all || []).length - 10) this.more(); },
    async choose(o) {
      if (!o) return;
      play("select");
      await Art.choose(g, o.url);
      toast("Portada actualizada");
      closeView(); renderHome();
      const lv = views.find(v => v.refresh && v.list && v.cols === 6); if (lv) lv.refresh(true);
      if (onChosen) onChosen();
    },
    cols: 5,
    onKey(k) {
      if (k === "y") { this.mode = (this.mode + 1) % ART_MODES.length; play("select"); this.reload(); return true; }
      if (k === "lb" || k === "rb") {
        const n = this.items().length; if (!n) return true;
        const i = clamp(this.i + (k === "lb" ? -10 : 10), 0, n - 1);
        if (i === this.i) bump(this.items()[this.i], k === "lb" ? "up" : "down"); else { this.i = i; play("move"); updateFocus(); }
        return true;
      }
      return false;
    },
    items() { return fis(this.el); }
  };
}

/* --- biblioteca: colecciones, orden y búsqueda --- */
const SORTS = ["Recientes", "A–Z", "Más jugados", "Solo instalados"];
const lib = { col: 0, sort: 0, query: "" };
function collections() {
  const names = [];
  games.forEach(g => (g.cols || []).forEach(c => { if (!names.includes(c)) names.push(c); }));
  const order = ["Favoritos", "Acción", "RPG", "Indies"];
  names.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  const out = ["Todos", ...groupNames().filter(n => !names.includes(n)), ...names];
  if (games.some(g => g.kind === "app")) out.push("Aplicaciones");
  if (games.some(isHidden)) out.push("Ocultos");
  return out;
}
function libraryList(query = lib.query) {
  const cols = collections(), col = cols[clamp(lib.col, 0, cols.length - 1)], q = norm(query.trim());
  let list = games.filter(g => col === "Ocultos" ? isHidden(g) : isHidden(g) ? false : col === "Todos" ? true : col === "Aplicaciones" ? g.kind === "app" : (g.cols || []).includes(col) || inGroup(g, col));
  if (q) list = list.filter(g => norm(g.name).includes(q));
  if (lib.sort === 1) list = [...list].sort((a, b) => a.name.localeCompare(b.name, "es"));
  else if (lib.sort === 2) list = [...list].sort((a, b) => (b.hours || 0) - (a.hours || 0));
  else if (lib.sort === 3) list = list.filter(g => g.installed);
  return list;
}
function libraryView() {
  return {
    cols: 6,
    hints() { return [["B", lib.query ? "Quitar búsqueda" : "Atrás"], ["Y", "Ordenar"], ["☰", "Buscar"], ["X", "Opciones"], ["A", "Iniciar"]]; },
    render(el) {
      el.innerHTML = head(I.all, "Biblioteca") + `<div class="tabs"></div><div class="vbody"><div class="grid"></div></div>`;
      this.refresh();
    },
    refresh(keepI) {
      const cols = collections(); lib.col = clamp(lib.col, 0, cols.length - 1);
      $(".tabs", this.el).innerHTML = `<span class="chip">LT</span>` + cols.map((c, i) => `<span class="tab${i === lib.col ? " on" : ""}">${esc(c)}</span>`).join("") + `<span class="chip">RT</span>`;
      this.list = libraryList();
      $(".vhead .sub", this.el).textContent = `${lib.query ? `“${lib.query}” · ` : ""}${this.list.length} · ${SORTS[lib.sort]}`;
      const grid = $(".grid", this.el); grid.innerHTML = "";
      if (!this.list.length) grid.outerHTML = `<div class="grid"><p class="empty" style="grid-column:1/-1">No hay nada por aquí.</p></div>`;
      else this.list.forEach((g, i) => {
        const b = buildTile(g, "tile fi"); b.style.setProperty("--k", i % 12);
        b.insertAdjacentHTML("beforeend", `<span class="cap">${esc(g.name)}</span>`);
        b.onclick = () => launchGame(g, b); grid.append(b);
      });
      if (!keepI) this.i = 0;
      updateFocus();
    },
    onKey(k) {
      if (k === "lt" || k === "rt") {
        const n = collections().length, c = clamp(lib.col + (k === "lt" ? -1 : 1), 0, n - 1);
        if (c === lib.col) { bump($(".tabs .on", this.el), k === "lt" ? "left" : "right"); return true; }
        lib.col = c; play("move"); this.refresh(); return true;
      }
      if (k === "y") { lib.sort = (lib.sort + 1) % SORTS.length; play("select"); this.refresh(); toast("Orden: " + SORTS[lib.sort]); return true; }
      if (k === "start") { openView(keyboardView(lib.query, txt => { lib.query = txt.trim(); this.refresh(); }, txt => libraryList(txt).length)); return true; }
      if (k === "lb" || k === "rb") {
        const n = this.list.length; if (!n) return true;
        const i = clamp(this.i + (k === "lb" ? -12 : 12), 0, n - 1);
        if (i === this.i) bump(this.items()[this.i], k === "lb" ? "up" : "down"); else { this.i = i; play("move"); updateFocus(); }
        return true;
      }
      return false;
    },
    onB() { if (!lib.query) return false; lib.query = ""; play("back"); this.refresh(); return true; },
    onX() { const g = this.list[this.i]; if (!g) play("bump"); else if (g.appid === state.running) askCloseRunning(); else openView(propsView(g)); return true; },
    items() { return fis(this.el); }
  };
}

/* --- teclado en pantalla --- */
/* opt: { title, placeholder, max, keys: "text" | "digits" | "hexUpper" | "hexLower", paste } */
function keyboardView(initial, onDone, countFor, opt = {}) {
  const tail = opt.paste ? ["Pegar", "Borrar", "Listo"] : ["Espacio", "Borrar", "Listo"];
  const rows = opt.keys === "digits" ? [[..."1234567890"], tail]
    : opt.keys === "hexUpper" ? [[..."1234567890"], [..."ABCDEF"], tail]
    : opt.keys === "hexLower" ? [[..."1234567890"], [..."abcdef"], tail]
    : [[..."1234567890"], [..."qwertyuiop"], [..."asdfghjklñ"], [..."zxcvbnm-'."], tail];
  const last = rows.length - 1, max = opt.max || 40;
  const flatIndex = (r, c) => rows.slice(0, r).reduce((s, x) => s + x.length, 0) + c;
  return {
    text: initial || "", r: rows.length > 2 ? 1 : 0, c: 0, i: flatIndex(rows.length > 2 ? 1 : 0, 0),
    hints: [["B", "Borrar"], ["Y", opt.paste ? "Pegar" : "Espacio"], ["☰", "Listo"], ["A", "Escribir"]],
    render(el) {
      el.innerHTML = head(opt.title ? I.gear : I.search, opt.title || "Buscar en la biblioteca") + `<div class="kb"><div class="kbfield"><span class="kbtext"></span><i class="caret"></i></div><div class="kbcount"></div><div class="kbrows">${rows.map((row, ri) => `<div class="kbrow">${row.map((k, ci) => `<button class="key fi${ri === last ? " wide" : ""}${k === "Listo" ? " ok" : ""}" data-r="${ri}" data-c="${ci}">${esc(k)}</button>`).join("")}</div>`).join("")}</div></div>`;
      fis(el).forEach(b => b.onclick = () => { this.r = +b.dataset.r; this.c = +b.dataset.c; this.press(); });
      this.upd();
    },
    syncFromIndex() { let n = this.i; for (let r = 0; r < rows.length; r++) { if (n < rows[r].length) { this.r = r; this.c = n; return; } n -= rows[r].length; } },
    upd() {
      const t = $(".kbtext", this.el);
      t.innerHTML = this.text ? esc(this.text) : `<span class="ph">${esc(opt.placeholder || "Nombre del juego…")}</span>`;
      if (countFor) { const n = countFor(this.text); $(".kbcount", this.el).textContent = this.text ? `${n} resultado${n === 1 ? "" : "s"}` : ""; }
      else $(".kbcount", this.el).textContent = opt.max ? `${this.text.length} / ${opt.max}` : "";
    },
    press() {
      const k = rows[this.r][this.c];
      if (k === "Espacio") this.type(" ");
      else if (k === "Pegar") this.paste();
      else if (k === "Borrar") this.del();
      else if (k === "Listo") this.done();
      else this.type(k);
    },
    type(ch) { if (this.text.length >= max) return play("bump"); this.text += ch; play("type"); this.upd(); },
    async paste() {
      const t = Host.has ? await Host.call("clipboard.get").catch(() => "") : await navigator.clipboard?.readText?.().catch(() => "");
      const clean = String(t || "").trim().slice(0, max);
      if (!clean) { toast("No hay texto copiado"); return play("bump"); }
      this.text = clean; play("select"); this.upd();
    },
    del() { if (!this.text) return play("bump"); this.text = this.text.slice(0, -1); play("back"); this.upd(); },
    done() { closeView(); onDone(this.text); },
    nav(dir) {
      let r = this.r, c = this.c;
      if (dir === "left") c--; else if (dir === "right") c++;
      else {
        const nr = r + (dir === "down" ? 1 : -1);
        if (nr < 0 || nr >= rows.length) return bump(this.items()[this.i], dir);
        c = Math.round(c * (rows[nr].length - 1) / Math.max(1, rows[r].length - 1)); r = nr;
      }
      if (c < 0 || c >= rows[r].length) return bump(this.items()[this.i], dir);
      this.r = r; this.c = c; this.i = flatIndex(r, c); play("move"); updateFocus();
    },
    onKey(k) {
      if (k === "x") { this.del(); return true; }
      if (k === "y") { opt.paste ? this.paste() : this.type(" "); return true; }
      if (k === "start") { this.done(); return true; }
      return false;
    },
    onB() { if (!this.text) return false; this.del(); return true; },
    onType(ch) {
      if (opt.keys === "digits" && !/\d/.test(ch)) return play("bump");
      if (/^hex/.test(opt.keys || "") && !/[0-9a-f]/i.test(ch)) return play("bump");
      ch = opt.keys === "hexUpper" ? ch.toUpperCase() : ch.toLowerCase();
      this.type(ch);
    },
    items() { return fis(this.el); }
  };

function viewerView(album, idx) {
  return {
    cls: "viewer", idx,
    hints() {
      return this.vid
        ? [["B", "Atrás"], ["X", "Borrar"], ["A", this.vid.paused ? "Reproducir" : "Pausa"], ["◀", "−5 s"], ["▶", "+5 s"], ["LB", "Anterior"], ["RB", "Siguiente"]]
        : [["B", "Atrás"], ["X", "Borrar"], ["◀", "Anterior"], ["▶", "Siguiente"]];
    },
    render(el) { el.innerHTML = `<div class="vwrap"><div class="media" style="display:contents"></div><div class="vcap"></div></div>`; this.show(); },
    show() {
      const list = album.list, c = list[this.idx], m = $(".media", this.el);
      this.stop();
      if (c.type === "video" && !c.url.startsWith("data:")) this.player(m, c.url);
      else m.innerHTML = `<img alt="" src="${esc(c.url)}">`;
      $(".vcap", this.el).textContent = `${c.game} · ${c.date} · ${this.idx + 1} de ${list.length}${c.type === "video" ? " · video" : ""}`;
      updateFocus();
    },
    /* Reproductor propio: la barra se esconde sola mientras corre y vuelve con cualquier botón. */
    player(m, url) {
      const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1"/><rect x="14" y="4.5" width="4.5" height="15" rx="1"/></svg>';
      m.innerHTML = `<div class="vplayer paused wait"><video src="${esc(url)}" autoplay playsinline preload="auto" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>
        <div class="vbig play">${PLAY}</div><div class="vbig load"><i></i></div>
        <div class="vctl"><span class="pp">${PLAY}</span><span class="t cur">0:00</span><div class="vbar"><i class="buf"></i><i class="fill"></i><i class="knob"></i></div><span class="t r dur">0:00</span></div></div>`;
      const box = $(".vplayer", m), v = $("video", box), bar = $(".vbar", box);
      const fmt = s => !isFinite(s) ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      const paint = () => {
        const d = v.duration || 0, p = d ? v.currentTime / d * 100 : 0;
        $(".fill", bar).style.width = p + "%"; $(".knob", bar).style.left = p + "%";
        if (d && v.buffered.length) $(".buf", bar).style.width = v.buffered.end(v.buffered.length - 1) / d * 100 + "%";
        $(".cur", box).textContent = fmt(v.currentTime); $(".dur", box).textContent = fmt(d);
      };
      const state = () => { box.classList.toggle("paused", v.paused); $(".pp", box).innerHTML = v.paused ? PLAY : PAUSE; this.wake(); updateFocus(); };
      v.addEventListener("timeupdate", paint); v.addEventListener("progress", paint); v.addEventListener("loadedmetadata", paint);
      v.addEventListener("play", state); v.addEventListener("pause", state); v.addEventListener("ended", state);
      v.addEventListener("waiting", () => box.classList.add("wait"));
      ["playing", "canplay", "seeked"].forEach(e => v.addEventListener(e, () => box.classList.remove("wait")));
      v.addEventListener("error", () => { box.classList.remove("wait"); box.insertAdjacentHTML("beforeend", `<p class="verr">No se pudo reproducir este video.<br><small>Puede que el formato no sea compatible (H.264 / VP9 sí lo son).</small></p>`); });
      v.addEventListener("click", () => this.toggle());
      bar.addEventListener("click", e => { const r = bar.getBoundingClientRect(); if (v.duration) v.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * v.duration; this.wake(); });
      box.addEventListener("pointermove", () => this.wake());
      this.vid = v; this.box = box;
      v.play().catch(() => state());
      this.wake();
    },
    wake() {
      if (!this.box) return;
      this.box.classList.remove("idle"); clearTimeout(this.idleT);
      this.idleT = setTimeout(() => { if (this.vid && !this.vid.paused) this.box.classList.add("idle"); }, 2600);
    },
    toggle() { const v = this.vid; if (!v) return; if (v.paused || v.ended) { if (v.ended) v.currentTime = 0; v.play().catch(() => {}); play("select"); } else { v.pause(); play("tick"); } },
    seek(s) { const v = this.vid; if (!v || !v.duration) return play("bump"); v.currentTime = clamp(v.currentTime + s, 0, v.duration - 0.05); play("tick"); this.wake(); },
    stop() { if (this.vid) { try { this.vid.pause(); this.vid.removeAttribute("src"); this.vid.load(); } catch {} } this.vid = this.box = null; clearTimeout(this.idleT); },
    go(d) {
      const n = this.idx + d;
      if (n < 0 || n >= album.list.length) return bump($(".vwrap img, .vwrap .vplayer", this.el), d > 0 ? "right" : "left");
      this.idx = n; play("move"); this.show();
    },
    onKey(k) {
      if (this.vid) this.wake();
      if (k === "a" && this.vid) { this.toggle(); return true; }
      if (k === "lb" || k === "rb") { this.go(k === "lb" ? -1 : 1); return true; }
      return false;
    },
    nav(d) {
      if (d !== "left" && d !== "right") return false;
      if (this.vid) this.seek(d === "right" ? 5 : -5); else this.go(d === "right" ? 1 : -1);
    },
    onB() { this.stop(); return false; },
    onX() {
      const c = album.list[this.idx];
      confirmDialog(`¿Borrar esta ${c.type === "video" ? "grabación" : "captura"}?\nNo se puede deshacer.`, "Borrar").then(ok => {
        if (!ok) return;
        this.stop();   // suelta el archivo antes de borrarlo
        Host.call("album.delete", { path: c.path }).catch(() => {});
        albumData = albumData.filter(x => x !== c); album.refresh();
        if (!album.list.length) return closeView();
        this.idx = Math.min(this.idx, album.list.length - 1); this.show(); toast("Se borró la captura");
      });
      return true;
    },
    items() { return []; }
  };
}

        if (!r || !r.ok) { bump(j); return toast(`La partida de ${f.name} no admite unirse ahora`); }
        toast(`Uniéndote a ${f.name}…`); launchGame(owned, j, { joined: true });
      };
      $('[data-a="msg"]', el).onclick = () => openSystemApp({ ...SYS.chat, name: "Chat con " + f.name, url: f.steamid ? `steam://friends/message/${f.steamid}` : SYS.chat.url });
      $('[data-a="steam"]', el).onclick = () => openSystemApp({ ...SYS.store, name: "Perfil de " + f.name, sub: "Abierto en Steam Big Picture", url: f.steamid ? `steam://url/SteamIDPage/${f.steamid}` : "steam://friends/players" });
    },
    items() { return fis(this.el); }
  };
}

function mockNews() {

      Art.apply($(".ahero", el), byId(n.appid) || { appid: n.appid, name: n.game }, "hero");
