/* ================= v2.9.8: gestión de datos ================= */
const SIZES = { 3489700: 52.4, 1245620: 61.8, 1145350: 12.9, 2379780: 0.2, 900101: 34.6, 1086940: 128.5, 1091500: 72.3, 367520: 9.1, 900102: 74.9, 2246340: 139.2, 504230: 1.2, 1551360: 116.4, 1794680: 0.9, 413150: 0.7, 1817070: 74.1, 2050650: 67.8, 900103: 0.1, 900104: 0.2, 900105: 0.4, 900106: 0.5 };
const gameSize = g => g.size || SIZES[g.appid] || (g.kind === "app" ? .3 : 8 + seeded(g.name, 60));
const fmtSize = v => v < 1 ? Math.round(v * 1024) + " MB" : v.toFixed(1) + " GB";
const DISK = { total: 1000, system: 64 };
function storageView() {
  return {
    hints: [["B", "Atrás"], ["A", "Opciones"]],
    render(el) {
      el.innerHTML = head(I.gear, "Gestión de datos") + `<div class="vbody"></div>`;
      if (Host.has) Host.call("storage.info").then(d => { this.disk = d; if (el.isConnected) this.refresh(); }).catch(() => {});
      this.refresh();
    },
    refresh() {
      const inst = games.filter(g => g.installed).sort((a, b) => gameSize(b) - gameSize(a));
      const used = inst.reduce((s, g) => s + gameSize(g), 0);
      const D = this.disk ? { total: Math.round(this.disk.total), system: Math.max(0, Math.round(this.disk.total - this.disk.free - used)) } : DISK;
      const free = this.disk ? this.disk.free : Math.max(0, D.total - D.system - used);
      const DISK_ = D, pct = v => (100 * v / DISK_.total).toFixed(2) + "%";
      $(".vbody", this.el).innerHTML = `<div class="stor"><h3>Almacenamiento interno <span>${free.toFixed(0)} GB libres de ${DISK_.total} GB</span></h3>
        <div class="sbar"><i style="width:${pct(DISK_.system)};background:var(--fg2)"></i><i style="width:${pct(used)};background:var(--accent)"></i></div>
        <div class="slegend"><span><i style="background:var(--fg2)"></i>${this.disk ? "Sistema y otros" : "Sistema"} · ${DISK_.system} GB</span><span><i style="background:var(--accent)"></i>Juegos y apps · ${used.toFixed(0)} GB</span><span><i style="background:var(--line)"></i>Libre · ${free.toFixed(0)} GB</span></div></div>
        <div class="sect">Instalados · de mayor a menor</div>` +
        inst.map(g => `<button class="lrow fi" data-g="${g.appid}"><img class="mini" alt="" data-art="${g.appid}"><span class="meta"><b>${esc(g.name)}</b><span>${esc(SOURCES[g.source] || "Steam")}${g.appid === state.running ? " · en ejecución" : ""}</span></span><span class="val">${fmtSize(gameSize(g))}</span></button>`).join("");
      $$("[data-art]", this.el).forEach(im => Art.apply(im, byId(im.dataset.art)));
      $$("[data-g]", this.el).forEach(b => b.onclick = () => this.options(byId(b.dataset.g)));
      updateFocus();
    },
    options(g) {
      openView(pickerView(g.name, I.gear, [{ label: g.kind === "app" ? "Desinstalar aplicación" : "Desinstalar juego", value: "rm" }, { label: "Abrir carpeta de instalación", value: "dir" }], null, v => {
        if (v === "dir") return openSystemApp({ ...SYS.explorer, name: g.name + " · carpeta" });
        if (g.appid === state.running) return toast("Cierra el juego antes de desinstalarlo");
        confirmDialog(`¿Desinstalar ${g.name}?\nSe liberarán ${fmtSize(gameSize(g))}. Tus partidas en la nube no se borran.`, "Desinstalar").then(ok => {
          if (!ok) return;
          Host.call("game.uninstall", { appid: g.appid, source: g.source }).catch(() => {});
          g.installed = false; renderHome(); this.refresh();
          notify({ icon: I.cloud, title: "Desinstalado", text: `${g.name} · ${fmtSize(gameSize(g))} liberados` });
        });
      }));
    },
    items() { return fis(this.el); }
  };
}

/* ================= v2.9.8: modo TV ================= */
function setTvMode(on, silent) {
  const was = document.documentElement.classList.contains("tv");
  document.documentElement.classList.toggle("tv", on);
  if (on !== was) { requestAnimationFrame(() => updateFocus()); if (!silent) notify({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="4.5" width="19" height="13" rx="2"/><path d="M8 21h8"/></svg>', title: on ? "Modo TV" : "Modo portátil", text: on ? "Pantalla externa conectada" : "Pantalla externa desconectada" }); }
}
Events.on("display.changed", d => setTvMode(!!d.tv));

/* ================= entrada: teclado, mando, táctil ================= */
function input(k) {
  Snd.ensure();
  if (activity()) return;                 // la primera pulsación solo quita la atenuación
  if (QM.open) return k === "guide" ? closeQuick() : qmInput(k);
  if (k === "guide") return guidePress();
  if (mode === "boot") return dismissBoot();
  if (mode === "lock") return lockPress(k);
  if (mode === "game") { if (k === "power") sleepConsole(); return; }
  if (mode !== "ui") return;
  const v = topView();
  if (v && v.onKey && v.onKey(k)) return;
  if (k === "up" || k === "down" || k === "left" || k === "right") v ? navView(v, k) : navHome(k);
  else if (k === "a") activate();
  else if (k === "b") back();
  else if (k === "x") optionsKey();
  else if (k === "power") sleepConsole();
  else if (k === "start") { const g = !v && focusedGame(); if (g) openView(propsView(g)); else if (!(v && v.isSettings)) openView(settingsView()); }
  else if (!v && (k === "lb" || k === "rb")) homeJump(k);
  else bump(v ? v.items()[v.i] : homeEl());
}
const KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "a", " ": "a", Escape: "b", Backspace: "b",
  x: "x", y: "y", m: "start", "+": "start", "=": "start", p: "power", q: "lb", e: "rb", PageUp: "lb", PageDown: "rb", z: "lt", c: "rt" };
addEventListener("keydown", e => {
  const v = topView();
  if (mode === "ui" && v && v.onType && e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); v.physical = true; v.onType(e.key); return; }
  if (mode === "ui" && v && v.onType && v.physical && e.key === "Enter") { e.preventDefault(); v.done(); return; }
  const lk = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (lk === "h" || lk === "Home") { e.preventDefault(); if (!e.repeat) guideDown(); return; }
  if (lk === "k") { e.preventDefault(); if (!e.repeat) { activity(); captureDown(); } return; }
  const k = KEYS[e.key] || KEYS[e.key.toLowerCase()];
  if (!k) return;
  e.preventDefault();
  if (!e.repeat || ["up", "down", "left", "right"].includes(k)) input(k);
});

addEventListener("keyup", e => {
  const lk = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (lk === "h" || lk === "Home") { e.preventDefault(); guideUp(); }
  else if (lk === "k") { e.preventDefault(); captureUp(); }
});
const pad = { held: {}, next: {} };
function pollPads(t) {
  const list = navigator.getGamepads && !(OVERLAY && Host.has && !document.hasFocus()) ? [...navigator.getGamepads()].filter(Boolean) : [];
  const p = list[0];
  if (p) {
    lastPad = p;
    const B = i => list.some(g => g.buttons[i] && (g.buttons[i].pressed || g.buttons[i].value > .5));
    const ax = [0, 1].map(i => list.reduce((m, g) => Math.abs(g.axes[i] || 0) > Math.abs(m) ? g.axes[i] : m, 0));
    const dirs = { up: B(12) || ax[1] < -.55, down: B(13) || ax[1] > .55, left: B(14) || ax[0] < -.55, right: B(15) || ax[0] > .55 };
    for (const d in dirs) {
      if (dirs[d]) {
        if (!pad.held[d]) { pad.held[d] = true; pad.next[d] = t + 360; input(d); }
        else if (t >= pad.next[d]) { pad.next[d] = t + 105; input(d); }
      } else pad.held[d] = false;
    }
    // distribución Xbox: A0 B1 X2 Y3 LB4 RB5 LT6 RT7 Menú9 Xbox16 (el botón Xbox lo manda el anfitrión en la app real)
    const btns = { a: 0, b: 1, x: 2, y: 3, lb: 4, rb: 5, lt: 6, rt: 7, start: 9 };
    for (const k in btns) { const pr = B(btns[k]); if (pr && !pad.held[k]) input(k); pad.held[k] = pr; }
    // en la app el botón Xbox lo maneja Scarlet (Windows); si la página también lo leyera, el menú rápido se abriría y cerraría a la vez
    if (!Host.has) { const gd = B(16); if (gd && !pad.held.guide) guideDown(); else if (!gd && pad.held.guide) guideUp(); pad.held.guide = gd; }
  }
  requestAnimationFrame(pollPads);
}
requestAnimationFrame(pollPads);
const padLabel = gp => trunc(gp.id.replace(/\(.*\)/, "").trim() || "Mando", 30);
addEventListener("gamepadconnected", e => {
  const gp = e.gamepad;
  if (gp.index > 0 && !state.pads.find(p => p.gp === gp.index)) {   // el índice 0 se toma como el mando integrado
    state.pads.push({ key: "gp" + gp.index, gp: gp.index, name: padLabel(gp), type: "USB / inalámbrico", player: state.pads.length + 1 });
    updatePadName(); refreshControls();
  }
  if (mode !== "boot") notify({ icon: I.pad, title: "Mando conectado", text: padLabel(gp) });
});
addEventListener("gamepaddisconnected", e => {
  const p = state.pads.find(x => x.gp === e.gamepad.index && x.gp > 0);
  if (p) { state.pads = state.pads.filter(x => x !== p); renumberPads(); updatePadName(); refreshControls(); }
  if (mode !== "boot") notify({ icon: I.pad, title: "Mando desconectado", text: p ? p.name : "Vuelve a conectarlo para seguir jugando" });
});
Events.on("pad.connected", p => { state.pads = state.pads.filter(x => x.key !== p.key).concat(p); updatePadName(); refreshControls(); notify({ icon: I.pad, title: "Mando conectado", text: `${p.name} · Jugador ${p.player}` }); });
Events.on("pad.disconnected", p => { state.pads = state.pads.filter(x => x.key !== p.key); renumberPads(); updatePadName(); refreshControls(); notify({ icon: I.pad, title: "Mando desconectado", text: p.name }); });

document.addEventListener("click", e => { Snd.ensure(); if (activity()) return; if (QM.open) { if (e.target.id === "qshade") closeQuick(); return; } if (mode === "ui") onHomeClick(e); }, true);
addEventListener("mousemove", () => { if (!dimmed) lastActivity = performance.now(); });
$("#boot").addEventListener("click", e => { e.stopPropagation(); dismissBoot(); });

/* ================= estado del sistema ================= */
function clockText(d = new Date()) {
  const m = String(d.getMinutes()).padStart(2, "0");
  if (settings.clock24 !== false) return String(d.getHours()).padStart(2, "0") + ":" + m;
  const h = d.getHours() % 12 || 12;
  return `${h}:${m} ${d.getHours() < 12 ? "a.m." : "p.m."}`;
}
function tick() {
  $$(".clock").forEach(c => c.textContent = clockText());
  $$(".wifi").forEach(w => w.style.opacity = navigator.onLine && (typeof sys === "undefined" || (sys.wifi && !sys.airplane)) ? 1 : .3);
  if (typeof QM !== "undefined" && QM.open) renderQuick();
}
setInterval(tick, 10000); tick();
/* Avisos al 20 % y al 10 % (cada uno una vez por descarga) y aviso al conectar el cargador. */
const battWarn = { 20: false, 10: false };
function setBatt(level, charging) {
  const wasCharging = deviceCharging;
  deviceBatt = level; deviceCharging = !!charging;
  $$(".battPct").forEach(e => e.textContent = Math.round(level * 100) + "%");
  $$(".battFill").forEach(e => { e.setAttribute("width", Math.max(1.5, 20.6 * level)); e.setAttribute("fill", level <= .15 && !charging ? "#e5484d" : charging ? "#3ad16b" : "currentColor"); });
  $$(".battBolt").forEach(e => e.style.display = charging ? "" : "none");
  if (mode === "boot") return;
  for (const t of [10, 20]) {
    if (!charging && level <= t / 100 && !battWarn[t]) { battWarn[10] = level <= .1; battWarn[20] = true; notifyBattery(level); break; }
  }
  if (charging || level > .25) { battWarn[20] = false; battWarn[10] = false; }
  else if (level > .12) battWarn[10] = false;
  if (charging && !wasCharging && typeof battReady !== "undefined" && battReady) notify({ icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/></svg>', title: "Cargando", text: `Batería al ${Math.round(level * 100)} %` });
}
let battReady = false; setTimeout(() => battReady = true, 4000);
if (navigator.getBattery) navigator.getBattery().then(b => { const u = () => setBatt(b.level, b.charging); u(); b.addEventListener("levelchange", u); b.addEventListener("chargingchange", u); }).catch(() => setBatt(.82)); else setBatt(.82);
addEventListener("resize", () => updateFocus());

/* ================= arranque ================= */
const bootStart = performance.now();
function dismissBoot() {
  if (mode !== "boot" || performance.now() - bootStart < 700) return;
  mode = "ui";
  $("#boot").classList.add("gone"); play("boot");
  renderHome();
  if (state.running && state.adopted) {   // la app se reinició con un juego abierto: se regresa a él
    state.adopted = false; showGame(runningGame()); mode = "game";
    Host.call("game.focus").catch(() => {});
  }
  if (!Host.has) {
    setTimeout(() => demoFriendOnline(), 7000); setInterval(() => demoFriendOnline(), 45000);
    setTimeout(() => { const g = byId(2246340); if (g && !state.downloads[g.appid]) { state.downloads[g.appid] = { p: .3, kind: "Actualizando" }; renderHome(); } }, 2500);
  }
}
Events.on("library.changed", async () => {
  const keep = focusedGame(); games = await Data.games();
  if (keep) { const i = homeGames().findIndex(g => g.appid === keep.appid); if (i >= 0) home.g = i; }
  if (mode !== "boot") renderHome();
  const lv = views.find(v => v.cols === 6 && v.refresh); if (lv) lv.refresh(true);
});
Events.on("profile.changed", p => { profile = p; renderUsers(); updateFocus(); });
Events.on("friends.changed", list => { if (Array.isArray(list)) { friends.length = 0; friends.push(...list); } });
(async function start() {
  if (OVERLAY) {   // solo el menú rápido: sin pantalla de inicio ni carga de juegos
    $("#boot").remove(); mode = "ui";
    const st = Host.has ? await Host.call("system.state").catch(() => null) : null;
    if (st) { Object.assign(sys, st); saveSys(); }
    if (Host.has) Host.call("sounds.list").then(m => { if (m && Object.keys(m).length) Snd.loadCustom(m); }).catch(() => {});
    if (!Host.has) { demoMedia(); openQuick(); }
    return;
  }
  [profile, games, friends] = await Promise.all([Data.profile(), Data.games(), Data.friends()]);
  if (Host.has) {
    const pads = await Host.call("pads.list").catch(() => null); if (pads && pads.length) state.pads = pads;
    Host.call("audio.mutebehind", { on: settings.muteBehind !== false }).catch(() => {});
    const st = await Host.call("system.state").catch(() => null); if (st) { Object.assign(sys, st); saveSys(); }
    Host.call("sounds.list").then(m => { if (m && Object.keys(m).length) Snd.loadCustom(m); }).catch(() => {});
    const gs = await Host.call("game.state").catch(() => null);
    if (gs && gs.appid && byId(gs.appid)) { state.running = gs.appid; state.adopted = !!gs.ready; }
  }
  updatePadName();
  renderUsers();
  if (mode !== "boot") renderHome();
  if (Host.has) setTimeout(dismissBoot, 2200);
  if (Host.has && settings.bootLast) {   // al encender: directo al último juego (solo si la consola acaba de arrancar)
    const info = await Host.call("app.info").catch(() => null);
    const last = info && info.startup && !state.running && games.find(g => g.kind !== "app" && g.installed && !isHidden(g));
    if (last) setTimeout(() => { if (mode === "ui" && !state.running) { toast("Abriendo " + last.name); launchGame(last); } }, 2600);
  }
})();
